org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:MaxMetaspaceSize=1g
# Build-speed knobs. CI gain on a typical Android release run is
# ~3–5 min wall-time, similar on a warm dev box. All three are safe
# defaults for projects this size (four subprojects with charon +
# ics-openvpn + amneziawg-tunnel native builds).
#
#   parallel             run independent subprojects on parallel workers
#   caching              local build cache — task outputs persisted by
#                        content hash and reused across invocations
#   configureondemand    skip configuring subprojects not in the
#                        requested task graph (big win for single-
#                        module Gradle calls like :app:bundleRelease)
#
# NOT enabled: org.gradle.configuration-cache. AGP 8.3.2 supports it
# but the vendored ics-openvpn / strongswan Gradle plugins haven't
# been audited for compat — turning it on risks breaking the build
# on a tag-push with no rollback window. Re-evaluate after a clean
# local `./gradlew assembleRelease --configuration-cache` succeeds.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.enableJetifier=false

# AmneziaWG (AWG) submodule build property. The upstream module's
# tunnel/build.gradle.kts reads this via providers.gradleProperty
# and bakes the package name into native cache-dir paths
# (RUNSTATEDIR=/data/data/<pkg>/cache, etc.). We keep upstream's
# default value so the library's runtime expectations stay
# consistent with their pre-built test fixtures.
amneziawgPackageName=org.amnezia.awg
