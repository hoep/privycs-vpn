name: Android Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_apks:
        type: boolean
        default: false
        description: 'Also build APKs (debug + release) alongside the AAB. Default is AAB-only to keep release time low; flip on for a side-load build.'

# Least-privilege workflow token — release needs contents: write to
# create the GitHub Release + upload the AAB/APK artefacts. Everything
# else stays at default-deny. v0.9.14.10 hardening per Aikido finding.
permissions:
  contents: write

env:
  NDK_VERSION: "27.3.13750724"
  OPENSSL_VERSION: "3.5.6"

jobs:
  check-changes:
    name: Check android/ changed since last tag
    runs-on: ubuntu-latest
    outputs:
      android_changed: ${{ steps.changes.outputs.changed }}
      build_apks: ${{ steps.flags.outputs.build_apks }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Diff android/ since previous tag
        id: changes
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -1)
          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag — treating as changed to avoid skipping the very first Android release."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "${PREV_TAG}..HEAD" -- android/ | wc -l)
          echo "Previous tag: $PREV_TAG"
          echo "Files changed in android/ since $PREV_TAG: $CHANGED"
          if [ "$CHANGED" -gt 0 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve build_apks flag
        id: flags
        env:
          # Pass context through env (not inline ${{ }}) so nothing is spliced
          # into the shell. build_apks is a boolean input + event_name an enum,
          # so neither is actually injectable — this is Aikido-pattern hygiene.
          EVENT_NAME: ${{ github.event_name }}
          BUILD_APKS_INPUT: ${{ inputs.build_apks }}
        # Default behaviour:
        #   - tag push    → AAB only (false). Play Store is the
        #                   primary distribution; APK builds add ~10
        #                   min of wall time and are rarely needed.
        #   - workflow_dispatch → honour the input toggle (default false).
        # To get APKs on a tag-driven release, re-run via
        # workflow_dispatch with build_apks=true after the tag is
        # already published; the propagator stays AAB-only on the
        # original release.
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "build_apks=$BUILD_APKS_INPUT" >> "$GITHUB_OUTPUT"
          else
            echo "build_apks=false" >> "$GITHUB_OUTPUT"
          fi

  # AAB build (mandatory when android/ changed) — Play Store payload.
  # Runs `assembleRelease bundleRelease` in one Gradle invocation when
  # the user opted into APKs, so the release APK and AAB share the
  # compileReleaseKotlin / minification / signing task outputs (saves
  # 3–5 min vs two separate Gradle calls).
  build-aab:
    name: Build AAB${{ needs.check-changes.outputs.build_apks == 'true' && ' + release APK' || '' }}
    needs: check-changes
    if: needs.check-changes.outputs.android_changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android NDK ${{ env.NDK_VERSION }}
        run: |
          yes | sdkmanager --install "ndk;${NDK_VERSION}" >/dev/null
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install native build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -qq -y --no-install-recommends \
            autoconf automake libtool libtool-bin pkg-config \
            gperf flex bison make perl python3 jq curl ca-certificates \
            libssl-dev libgmp-dev \
            swig cmake ninja-build

      - name: Cache OpenSSL source + libcrypto artifacts
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            android/.build-cache/openssl
            android/vendor/strongswan/src/frontends/android/app/src/main/jni/openssl
          key: openssl-${{ env.OPENSSL_VERSION }}-ndk-${{ env.NDK_VERSION }}-${{ runner.os }}

      # Gradle cache — extended over the v0.9.14.x version to also
      # include android/.gradle/ (project-level Gradle state:
      # dependency resolution, kotlinc daemon config) and the local
      # build cache directory. The build cache stores task outputs
      # keyed by content hash, so repeat builds where only a handful
      # of Kotlin/resource files changed re-use the cached
      # compileReleaseKotlin / mergeReleaseResources / minify outputs
      # instead of recomputing from scratch.
      #
      # Cache key includes runner.os + a hash of all *.gradle* and
      # gradle-wrapper.properties files. Any source change of those
      # invalidates the key (correct — build classpath changed); pure
      # Kotlin/XML edits hit the same key and re-use the build cache.
      # Restore-keys allow a partial hit when build files changed but
      # most of the dependency tree is still relevant.
      - name: Cache Gradle packages + local build cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Prepare strongSwan (autogen + openssl libcrypto_static)
        run: ./scripts/prepare-strongswan.sh
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}

      - name: Prepare AmneziaWG (rename native libs to coexist with WG)
        run: ./scripts/prepare-amneziawg.sh

      - name: Set up Go (Smart Decision Engine)
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build Smart Decision Engine AAR (gomobile)
        # gomobile-bind the shared Go core (engine/ffi) into
        # android/app/libs/engine.aar before gradle. Needs the NDK (set above).
        run: ../engine/scripts/build-engine-aar.sh
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_ROOT }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        # Skip vendor submodule tests — we are a library consumer, not
        # the AWG project. Upstream's own test suite occasionally trips
        # on environment-specific assumptions (locale, file-encoding)
        # that have nothing to do with our integration.
        run: ./gradlew test -x :amneziawg-tunnel:testDebugUnitTest -x :amneziawg-tunnel:testReleaseUnitTest -x :amneziawg-tunnel:test

      - name: Decode release keystore from secret
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > app/upload.keystore
          test -s app/upload.keystore || { echo "Keystore decode produced empty file — check ANDROID_KEYSTORE_B64 secret"; exit 1; }

      # Build the release artefacts.
      #
      # AAB-only path (default for tag pushes):
      #   ./gradlew bundleRelease
      # AAB + release APK path (workflow_dispatch with build_apks=true):
      #   ./gradlew assembleRelease bundleRelease
      #
      # Single Gradle invocation in the combined case so the
      # compileReleaseKotlin / minifyReleaseWithR8 / signing tasks are
      # computed once and shared between the assemble and bundle output
      # variants. Two separate invocations re-ran them from scratch.
      - name: Build release artefacts
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/upload.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Pro-tier license verifier — embed the ed25519 public key
          # whose private half lives in the gateway env (LemonSqueezy
          # webhook signer). Read by app/build.gradle.kts as a
          # buildConfigField. Empty when the secret isn't set, in which
          # case License.verify rejects every key with NO_PUBLIC_KEY —
          # fail-closed, identical to Desktop.
          LICENSE_PUBLIC_KEY_HEX: ${{ secrets.LICENSE_PUBLIC_KEY_HEX }}
        run: |
          if [ "${{ needs.check-changes.outputs.build_apks }}" = "true" ]; then
            ./gradlew assembleRelease bundleRelease
          else
            ./gradlew bundleRelease
          fi

      - name: Extract version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # workflow_dispatch has no tag context; derive from the
            # latest tag pointing at HEAD (or fall back to 'dev').
            VERSION=$(git describe --tags --exact-match 2>/dev/null | sed 's/^v//' || echo "dev")
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Rename AAB to match the APK's release-naming convention.
      # The APK gets renamed to privycs-vpn-X.Y.Z(-debug).apk via
      # build.gradle.kts's applicationVariants.all { outputFileName }
      # block, but that rename hook only fires for APK builds —
      # bundleRelease produces the bare 'app-release.aab'. Renaming
      # here keeps GitHub Release asset names consistent.
      - name: Rename AAB to release naming
        run: |
          cd app/build/outputs/bundle/release
          if [ -f "app-release.aab" ]; then
            mv app-release.aab "privycs-vpn-${{ steps.version.outputs.version }}.aab"
          fi
          ls -la

      - name: Generate SHA256 checksums
        run: |
          if [ -d app/build/outputs/apk/release ]; then
            cd app/build/outputs/apk/release
            find . -name "*.apk" -exec sh -c 'sha256sum "$1" > "$1.sha256"' _ {} \;
            cd - >/dev/null
          fi
          cd app/build/outputs/bundle/release
          find . -name "*.aab" -exec sh -c 'sha256sum "$1" > "$1.sha256"' _ {} \;

      - name: Upload release AAB artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: privycs-vpn-aab-${{ steps.version.outputs.version }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/bundle/release/*.aab.sha256
          retention-days: 90

      - name: Upload release APK artifact
        if: needs.check-changes.outputs.build_apks == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: privycs-vpn-release-${{ steps.version.outputs.version }}
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/release/*.sha256
          retention-days: 90

      # Attach the AAB (and release APK if built) to the GitHub Release.
      # Uses the gh CLI (not softprops/action-gh-release) so a release the
      # Desktop/iOS workflow already created for the SAME tag is tolerated:
      # softprops races on concurrent create and fails with
      # "already_exists" (v1.1.5.98 hit exactly this). create-if-missing +
      # upload --clobber is race-safe AND re-run-safe.
      - name: Create / append to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="$REF_NAME"; REPO="${{ github.repository }}"
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --title "Privycs VPN $TAG" \
              $([ "${TAG#*-}" != "$TAG" ] && echo --prerelease) --generate-notes \
              || echo "Race: release was created by another workflow just now."
          fi
          shopt -s nullglob
          # Paths are relative to the job's working-directory (android/), so NO
          # "android/" prefix here — unlike the upload-artifact action steps,
          # which run from the repo root. (A leading android/ made these globs
          # match nothing -> empty array -> "gh release upload requires at
          # least 2 args" on v1.1.5.100.)
          files=(app/build/outputs/bundle/release/*.aab \
                 app/build/outputs/bundle/release/*.aab.sha256 \
                 app/build/outputs/apk/release/*.apk \
                 app/build/outputs/apk/release/*.sha256)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No AAB/APK artifacts found to upload"; exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --repo "$REPO" --clobber

  # Debug APK build — parallel to build-aab when build_apks=true.
  # Conditional: only runs when the user opted into APK builds (via
  # workflow_dispatch with build_apks=true). For the tag-push default
  # path this job is skipped entirely.
  #
  # Independent setup: NDK + OpenSSL + strongSwan + AmneziaWG all
  # have to be in place because assembleDebug pulls them in via
  # ndk-build at compile time. Cache hits from prior runs make the
  # second setup quick after the first build has populated the cache.
  build-debug-apk:
    name: Build debug APK
    needs: check-changes
    if: needs.check-changes.outputs.android_changed == 'true' && needs.check-changes.outputs.build_apks == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android NDK ${{ env.NDK_VERSION }}
        run: |
          yes | sdkmanager --install "ndk;${NDK_VERSION}" >/dev/null
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install native build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -qq -y --no-install-recommends \
            autoconf automake libtool libtool-bin pkg-config \
            gperf flex bison make perl python3 jq curl ca-certificates \
            libssl-dev libgmp-dev \
            swig cmake ninja-build

      - name: Cache OpenSSL source + libcrypto artifacts
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            android/.build-cache/openssl
            android/vendor/strongswan/src/frontends/android/app/src/main/jni/openssl
          key: openssl-${{ env.OPENSSL_VERSION }}-ndk-${{ env.NDK_VERSION }}-${{ runner.os }}

      - name: Cache Gradle packages + local build cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Prepare strongSwan (autogen + openssl libcrypto_static)
        run: ./scripts/prepare-strongswan.sh
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}

      - name: Prepare AmneziaWG (rename native libs to coexist with WG)
        run: ./scripts/prepare-amneziawg.sh

      - name: Set up Go (Smart Decision Engine)
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build Smart Decision Engine AAR (gomobile)
        # gomobile-bind the shared Go core (engine/ffi) into
        # android/app/libs/engine.aar before gradle. Needs the NDK (set above).
        run: ../engine/scripts/build-engine-aar.sh
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_ROOT }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Extract version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION=$(git describe --tags --exact-match 2>/dev/null | sed 's/^v//' || echo "dev")
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate SHA256 checksums
        run: |
          cd app/build/outputs/apk/debug
          find . -name "*.apk" -exec sh -c 'sha256sum "$1" > "$1.sha256"' _ {} \;

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: privycs-vpn-debug-${{ steps.version.outputs.version }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/debug/*.sha256
          retention-days: 90

      # Append the debug APK to the existing GitHub Release. gh upload
      # --clobber so it's safe whether build-aab or another platform
      # workflow created the release first (same race-tolerance as above).
      - name: Append debug APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="$REF_NAME"; REPO="${{ github.repository }}"
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --title "Privycs VPN $TAG" \
              $([ "${TAG#*-}" != "$TAG" ] && echo --prerelease) --generate-notes \
              || echo "Race: release was created by another workflow just now."
          fi
          shopt -s nullglob
          # Relative to working-directory (android/) — no android/ prefix.
          files=(app/build/outputs/apk/debug/*.apk \
                 app/build/outputs/apk/debug/*.sha256)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No debug APK found to upload"; exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --repo "$REPO" --clobber

  propagate-previous-android:
    name: Propagate previous Android APKs
    needs: check-changes
    if: needs.check-changes.outputs.android_changed == 'false' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # actions: read needed by `gh run list` inside the propagation
      # script when it polls for an in-flight android-release run on
      # the candidate prior tag. v0.9.14.73 propagator failed at
      # 1.7 s with no stdout because gh run list returned permission-
      # denied to stderr (silenced via 2>/dev/null) and the for-loop
      # state went haywire under set -e.
      actions: read
    steps:
      - name: Checkout (for gh CLI auth context)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Find previous tag with Android assets and re-attach them
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # SEMVER-SORTED tag list — was previously gh-default ordering
          # (release-creation-time) which produced a race when the
          # immediately-prior tag's android-release was still building.
          # Same race that hit desktop-release on v0.9.14.9 (propagator
          # ran in 26s, picked v0.9.14.7 because v0.9.14.8's 6-min
          # build was still uploading). sort -rV picks the highest-semver
          # release with assets, regardless of in-flight build clocks.
          # Plus: poll the candidate's release for up to 10 min if a
          # desktop/android-release run is still in progress for that tag.
          TAGS=$(gh release list --repo "$REPO" --limit 50 --json tagName --jq '.[].tagName' \
                 | grep -v "^${CURRENT_TAG}$" \
                 | sort -rV || true)

          wait_for_android_assets() {
            local tag="$1"
            # Bumped from 600 s (10 min) to 2100 s (35 min) — full
            # Android builds with native OpenVPN+strongSwan compile
            # routinely take 25–30 min, and the previous timeout
            # let propagate-previous skip past an in-flight build
            # of the prior tag and fall back to two-tags-back. The
            # symptom was: after tagging v0.9.14.91 (Android-bumped)
            # immediately followed by .92/.93 (macOS-only),
            # propagate-previous of .92 timed out waiting for .91
            # and grabbed .88's APK instead. Heal cycle was manual
            # `gh release upload`. 35 min covers a full clean
            # Android build with margin.
            local deadline=$(( $(date +%s) + 2100 ))
            while [ "$(date +%s)" -lt "$deadline" ]; do
              # Check for either APK OR AAB — both are Android assets
              # we want to forward. v0.9.14.91: was "apk-only" before,
              # which made AAB releases stranded on .88 because the
              # next .89/.90 propagated only the APK, never the AAB.
              local has=$(gh release view "$tag" --repo "$REPO" --json assets --jq '.assets[].name' 2>/dev/null \
                          | grep -cE '\.(apk|aab)$' || true)
              if [ "$has" -gt 0 ]; then
                return 0
              fi
              echo "  $tag has no APK/AAB assets yet — waiting 30s…"
              sleep 30
            done
            return 1
          }

          PREV_TAG=""
          for tag in $TAGS; do
            has_android=$(gh release view "$tag" --repo "$REPO" --json assets --jq '.assets[].name' 2>/dev/null \
                          | grep -cE '\.(apk|aab)$' || true)
            if [ "$has_android" -gt 0 ]; then
              PREV_TAG="$tag"
              break
            fi
            running=$(gh run list --repo "$REPO" \
                      --workflow=android-release.yml \
                      --json databaseId,status,headBranch \
                      --jq ".[] | select(.headBranch==\"$tag\" and (.status==\"in_progress\" or .status==\"queued\")) | .databaseId" \
                      2>/dev/null | head -1)
            if [ -n "$running" ]; then
              echo "Tag $tag has an in-flight android-release run ($running) — waiting up to 10 min for assets…"
              if wait_for_android_assets "$tag"; then
                PREV_TAG="$tag"
                break
              fi
              echo "  $tag wait timed out — moving to next-highest tag."
            fi
          done

          if [ -z "$PREV_TAG" ]; then
            echo "No previous release with Android APK/AAB found — nothing to propagate."
            exit 0
          fi
          echo "Previous Android-bearing tag: $PREV_TAG"

          mkdir -p /tmp/android-assets
          echo "Downloading Android artifacts (APK + AAB) from $PREV_TAG..."
          gh release download "$PREV_TAG" \
            --repo "$REPO" \
            --pattern "*.apk" \
            --pattern "*.apk.sha256" \
            --pattern "*.aab" \
            --pattern "*.aab.sha256" \
            --dir /tmp/android-assets

          # Ensure the current release exists. desktop-release.yml may still
          # be running; if it hasn't created the release yet, we create it
          # here. The softprops action in desktop-release is idempotent and
          # just appends its own assets later.
          if ! gh release view "$CURRENT_TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $CURRENT_TAG does not exist yet — creating it."
            gh release create "$CURRENT_TAG" \
              --repo "$REPO" \
              --title "Privycs VPN $CURRENT_TAG" \
              --generate-notes || echo "Race: release was created by another job just now."
          else
            echo "Release $CURRENT_TAG already exists — uploading to it."
          fi

          echo "Uploading Android assets to $CURRENT_TAG..."
          # nullglob so an empty pattern just expands to nothing instead
          # of literal "*.aab" — keeps the upload silent when a propagated
          # tag predates the AAB introduction (v0.9.14.84 was the first).
          shopt -s nullglob
          ASSETS=( /tmp/android-assets/*.apk /tmp/android-assets/*.apk.sha256 /tmp/android-assets/*.aab /tmp/android-assets/*.aab.sha256 )
          if [ "${#ASSETS[@]}" -gt 0 ]; then
            gh release upload "$CURRENT_TAG" \
              --repo "$REPO" \
              --clobber \
              "${ASSETS[@]}"
          fi

          echo "Propagated Android assets from $PREV_TAG to $CURRENT_TAG (no rebuild)."
