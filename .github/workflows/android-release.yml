name: Android Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  check-changes:
    name: Check android/ changed since last tag
    runs-on: ubuntu-latest
    outputs:
      android_changed: ${{ steps.changes.outputs.changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diff android/ since previous tag
        id: changes
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -1)
          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag — treating as changed to avoid skipping the very first Android release."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "${PREV_TAG}..HEAD" -- android/ | wc -l)
          echo "Previous tag: $PREV_TAG"
          echo "Files changed in android/ since $PREV_TAG: $CHANGED"
          if [ "$CHANGED" -gt 0 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Build Release APK
    needs: check-changes
    if: needs.check-changes.outputs.android_changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Generate SHA256 checksums
        run: |
          cd app/build/outputs/apk
          find . -name "*.apk" -exec sh -c 'sha256sum "$1" > "$1.sha256"' _ {} \;

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: privycs-vpn-release-${{ steps.version.outputs.version }}
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/release/*.sha256
          retention-days: 90

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: privycs-vpn-debug-${{ steps.version.outputs.version }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/debug/*.sha256
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Privycs VPN ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/release/*.sha256
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/debug/*.sha256

  propagate-previous-android:
    name: Propagate previous Android APKs
    needs: check-changes
    if: needs.check-changes.outputs.android_changed == 'false' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (for gh CLI auth context)
        uses: actions/checkout@v4

      - name: Find previous tag with Android assets and re-attach them
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Walk backwards through recent releases to find the newest one that
          # has an actual .apk asset attached. Skip the current tag itself.
          PREV_TAG=""
          gh release list --limit 50 --json tagName --jq '.[].tagName' | while read -r tag; do
            if [ "$tag" = "$CURRENT_TAG" ]; then
              continue
            fi
            has_apk=$(gh release view "$tag" --json assets --jq '.assets[].name' 2>/dev/null | grep -cE '\.apk$' || true)
            if [ "$has_apk" -gt 0 ]; then
              echo "Previous Android-bearing tag: $tag"
              echo "$tag" > /tmp/prev_tag
              break
            fi
          done

          if [ ! -s /tmp/prev_tag ]; then
            echo "No previous release with Android APKs found — nothing to propagate."
            exit 0
          fi

          PREV_TAG=$(cat /tmp/prev_tag)
          mkdir -p /tmp/apks
          cd /tmp/apks

          echo "Downloading Android artifacts from $PREV_TAG..."
          gh release download "$PREV_TAG" --pattern "*.apk" --pattern "*.apk.sha256"

          # Ensure the current release exists before uploading. desktop-release.yml
          # may still be running — create it here if missing so upload doesn't fail
          # with "release not found". If desktop-release creates it afterwards, its
          # softprops action is idempotent and just appends its own assets.
          if ! gh release view "$CURRENT_TAG" >/dev/null 2>&1; then
            echo "Release $CURRENT_TAG does not exist yet — creating it."
            gh release create "$CURRENT_TAG" \
              --title "Privycs VPN $CURRENT_TAG" \
              --generate-notes || echo "Race: release was created by another job just now."
          else
            echo "Release $CURRENT_TAG already exists — will upload assets to it."
          fi

          echo "Re-uploading APKs to $CURRENT_TAG..."
          gh release upload "$CURRENT_TAG" *.apk *.apk.sha256 --clobber

          echo "Propagated Android APKs from $PREV_TAG to $CURRENT_TAG (no rebuild)."
