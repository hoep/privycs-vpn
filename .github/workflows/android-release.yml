name: Android Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  NDK_VERSION: "27.3.13750724"
  OPENSSL_VERSION: "3.5.6"

jobs:
  check-changes:
    name: Check android/ changed since last tag
    runs-on: ubuntu-latest
    outputs:
      android_changed: ${{ steps.changes.outputs.changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diff android/ since previous tag
        id: changes
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -1)
          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag — treating as changed to avoid skipping the very first Android release."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "${PREV_TAG}..HEAD" -- android/ | wc -l)
          echo "Previous tag: $PREV_TAG"
          echo "Files changed in android/ since $PREV_TAG: $CHANGED"
          if [ "$CHANGED" -gt 0 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Build Release APK
    needs: check-changes
    if: needs.check-changes.outputs.android_changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK ${{ env.NDK_VERSION }}
        run: |
          yes | sdkmanager --install "ndk;${NDK_VERSION}" >/dev/null
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install native build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -qq -y --no-install-recommends \
            autoconf automake libtool libtool-bin pkg-config \
            gperf flex bison make perl python3 jq curl ca-certificates \
            libssl-dev libgmp-dev

      - name: Cache OpenSSL source + libcrypto artifacts
        uses: actions/cache@v4
        with:
          path: |
            android/.build-cache/openssl
            android/vendor/strongswan/src/frontends/android/app/src/main/jni/openssl
          key: openssl-${{ env.OPENSSL_VERSION }}-ndk-${{ env.NDK_VERSION }}-${{ runner.os }}

      - name: Cache strongSwan autotools artifacts
        uses: actions/cache@v4
        with:
          path: |
            android/vendor/strongswan/Android.common.mk
            android/vendor/strongswan/config.h
            android/vendor/strongswan/src/**/*keywords.c
            android/vendor/strongswan/src/**/oid.c
          key: strongswan-autogen-${{ hashFiles('android/vendor/strongswan/Android.common.mk.in', 'android/vendor/strongswan/configure.ac') }}

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Prepare strongSwan (autogen + openssl libcrypto_static)
        run: ./scripts/prepare-strongswan.sh
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Generate SHA256 checksums
        run: |
          cd app/build/outputs/apk
          find . -name "*.apk" -exec sh -c 'sha256sum "$1" > "$1.sha256"' _ {} \;

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: privycs-vpn-release-${{ steps.version.outputs.version }}
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/release/*.sha256
          retention-days: 90

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: privycs-vpn-debug-${{ steps.version.outputs.version }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/debug/*.sha256
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Privycs VPN ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/release/*.sha256
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/debug/*.sha256

  propagate-previous-android:
    name: Propagate previous Android APKs
    needs: check-changes
    if: needs.check-changes.outputs.android_changed == 'false' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (for gh CLI auth context)
        uses: actions/checkout@v4

      - name: Find previous tag with Android assets and re-attach them
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Collect recent release tags, skipping the current one. Use --repo
          # so gh does not rely on a .git context (the download step works in
          # /tmp which isn't a git repo).
          TAGS=$(gh release list --repo "$REPO" --limit 50 --json tagName --jq '.[].tagName' \
                 | grep -v "^${CURRENT_TAG}$" || true)

          PREV_TAG=""
          for tag in $TAGS; do
            has_apk=$(gh release view "$tag" --repo "$REPO" --json assets --jq '.assets[].name' 2>/dev/null \
                      | grep -cE '\.apk$' || true)
            if [ "$has_apk" -gt 0 ]; then
              PREV_TAG="$tag"
              break
            fi
          done

          if [ -z "$PREV_TAG" ]; then
            echo "No previous release with Android APKs found — nothing to propagate."
            exit 0
          fi
          echo "Previous Android-bearing tag: $PREV_TAG"

          mkdir -p /tmp/apks
          echo "Downloading Android artifacts from $PREV_TAG..."
          gh release download "$PREV_TAG" \
            --repo "$REPO" \
            --pattern "*.apk" \
            --pattern "*.apk.sha256" \
            --dir /tmp/apks

          # Ensure the current release exists. desktop-release.yml may still
          # be running; if it hasn't created the release yet, we create it
          # here. The softprops action in desktop-release is idempotent and
          # just appends its own assets later.
          if ! gh release view "$CURRENT_TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $CURRENT_TAG does not exist yet — creating it."
            gh release create "$CURRENT_TAG" \
              --repo "$REPO" \
              --title "Privycs VPN $CURRENT_TAG" \
              --generate-notes || echo "Race: release was created by another job just now."
          else
            echo "Release $CURRENT_TAG already exists — uploading to it."
          fi

          echo "Uploading APKs to $CURRENT_TAG..."
          gh release upload "$CURRENT_TAG" \
            --repo "$REPO" \
            --clobber \
            /tmp/apks/*.apk /tmp/apks/*.apk.sha256

          echo "Propagated Android APKs from $PREV_TAG to $CURRENT_TAG (no rebuild)."
