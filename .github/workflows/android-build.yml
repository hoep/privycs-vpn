name: Android Build

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'

env:
  NDK_VERSION: "27.3.13750724"
  OPENSSL_VERSION: "3.5.6"

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK ${{ env.NDK_VERSION }}
        run: |
          yes | sdkmanager --install "ndk;${NDK_VERSION}" >/dev/null
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install native build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -qq -y --no-install-recommends \
            autoconf automake libtool libtool-bin pkg-config \
            gperf flex bison make perl python3 jq curl ca-certificates \
            libssl-dev libgmp-dev

      - name: Cache OpenSSL source + libcrypto artifacts
        uses: actions/cache@v4
        with:
          path: |
            android/.build-cache/openssl
            android/vendor/strongswan/src/frontends/android/app/src/main/jni/openssl
          key: openssl-${{ env.OPENSSL_VERSION }}-ndk-${{ env.NDK_VERSION }}-${{ runner.os }}

      # The autotools-generated artifacts (Android.common.mk, keyword tables,
      # oid.c, etc.) span too many hard-to-enumerate files to cache reliably:
      # a partial cache hit leaves the tree in an inconsistent state and
      # ndk-build fails with "No rule to make target
      # proposal_keywords_static.c". Running autogen + make every time costs
      # ~60s, which is acceptable since the heavy OpenSSL step is cached
      # above.

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Prepare strongSwan (autogen + openssl libcrypto_static)
        run: ./scripts/prepare-strongswan.sh
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: privycs-vpn-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: android/app/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore

  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK ${{ env.NDK_VERSION }}
        run: |
          yes | sdkmanager --install "ndk;${NDK_VERSION}" >/dev/null
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install native build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -qq -y --no-install-recommends \
            autoconf automake libtool libtool-bin pkg-config \
            gperf flex bison make perl python3 jq curl ca-certificates \
            libssl-dev libgmp-dev

      - name: Cache OpenSSL source + libcrypto artifacts
        uses: actions/cache@v4
        with:
          path: |
            android/.build-cache/openssl
            android/vendor/strongswan/src/frontends/android/app/src/main/jni/openssl
          key: openssl-${{ env.OPENSSL_VERSION }}-ndk-${{ env.NDK_VERSION }}-${{ runner.os }}

      # The autotools-generated artifacts (Android.common.mk, keyword tables,
      # oid.c, etc.) span too many hard-to-enumerate files to cache reliably:
      # a partial cache hit leaves the tree in an inconsistent state and
      # ndk-build fails with "No rule to make target
      # proposal_keywords_static.c". Running autogen + make every time costs
      # ~60s, which is acceptable since the heavy OpenSSL step is cached
      # above.

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Prepare strongSwan (autogen + openssl libcrypto_static)
        run: ./scripts/prepare-strongswan.sh
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Android Lint
        # Only lint :app - the :strongswan-lib wrapper is advisory (see its
        # build.gradle.kts) and triggering its lint would also force the
        # NDK configure step which is already covered by the build job.
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: android/app/build/reports/lint-results-debug.html
          retention-days: 7
          if-no-files-found: ignore
