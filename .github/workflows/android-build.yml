name: Android Build

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'

# Least-privilege workflow token — build only needs to read source.
# v0.9.14.10 hardening per Aikido finding "Overly Broad Permissions".
permissions:
  contents: read

env:
  NDK_VERSION: "27.3.13750724"
  OPENSSL_VERSION: "3.5.6"

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android NDK ${{ env.NDK_VERSION }}
        run: |
          yes | sdkmanager --install "ndk;${NDK_VERSION}" >/dev/null
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install native build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -qq -y --no-install-recommends \
            autoconf automake libtool libtool-bin pkg-config \
            gperf flex bison make perl python3 jq curl ca-certificates \
            libssl-dev libgmp-dev \
            swig cmake ninja-build
          # swig: required by ics-openvpn CMake for the OpenVPN 3 client
          #       SWIG -> Java bindings codegen step.
          # cmake: AGP bundles its own CMake via sdkmanager but falls back to
          #        PATH when externalNativeBuild { cmake { version = ... } }
          #        is pinned; having cmake on PATH avoids a 600MB Android SDK
          #        cmake install.
          # ninja-build: CMake's preferred generator on AGP; faster than
          #        Unix Makefiles for parallel ovpn3 + ovpn2 builds.

      - name: Cache OpenSSL source + libcrypto artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            android/.build-cache/openssl
            android/vendor/strongswan/src/frontends/android/app/src/main/jni/openssl
          key: openssl-${{ env.OPENSSL_VERSION }}-ndk-${{ env.NDK_VERSION }}-${{ runner.os }}

      # The autotools-generated artifacts (Android.common.mk, keyword tables,
      # oid.c, etc.) span too many hard-to-enumerate files to cache reliably:
      # a partial cache hit leaves the tree in an inconsistent state and
      # ndk-build fails with "No rule to make target
      # proposal_keywords_static.c". Running autogen + make every time costs
      # ~60s, which is acceptable since the heavy OpenSSL step is cached
      # above.

      - name: Cache Gradle packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Prepare strongSwan (autogen + openssl libcrypto_static)
        run: ./scripts/prepare-strongswan.sh
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}

      - name: Prepare AmneziaWG (rename native libs to coexist with WG)
        run: ./scripts/prepare-amneziawg.sh

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        # Skip vendor submodule tests — we are a library consumer, not
        # the AWG project. Upstream's own test suite occasionally trips
        # on environment-specific assumptions (locale, file-encoding)
        # that have nothing to do with our integration.
        run: ./gradlew test --no-daemon -x :amneziawg-tunnel:testDebugUnitTest -x :amneziawg-tunnel:testReleaseUnitTest -x :amneziawg-tunnel:test

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: privycs-vpn-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: android/app/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore

  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android NDK ${{ env.NDK_VERSION }}
        run: |
          yes | sdkmanager --install "ndk;${NDK_VERSION}" >/dev/null
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install native build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -qq -y --no-install-recommends \
            autoconf automake libtool libtool-bin pkg-config \
            gperf flex bison make perl python3 jq curl ca-certificates \
            libssl-dev libgmp-dev \
            swig cmake ninja-build
          # swig: required by ics-openvpn CMake for the OpenVPN 3 client
          #       SWIG -> Java bindings codegen step.
          # cmake: AGP bundles its own CMake via sdkmanager but falls back to
          #        PATH when externalNativeBuild { cmake { version = ... } }
          #        is pinned; having cmake on PATH avoids a 600MB Android SDK
          #        cmake install.
          # ninja-build: CMake's preferred generator on AGP; faster than
          #        Unix Makefiles for parallel ovpn3 + ovpn2 builds.

      - name: Cache OpenSSL source + libcrypto artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            android/.build-cache/openssl
            android/vendor/strongswan/src/frontends/android/app/src/main/jni/openssl
          key: openssl-${{ env.OPENSSL_VERSION }}-ndk-${{ env.NDK_VERSION }}-${{ runner.os }}

      # The autotools-generated artifacts (Android.common.mk, keyword tables,
      # oid.c, etc.) span too many hard-to-enumerate files to cache reliably:
      # a partial cache hit leaves the tree in an inconsistent state and
      # ndk-build fails with "No rule to make target
      # proposal_keywords_static.c". Running autogen + make every time costs
      # ~60s, which is acceptable since the heavy OpenSSL step is cached
      # above.

      - name: Cache Gradle packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Prepare strongSwan (autogen + openssl libcrypto_static)
        run: ./scripts/prepare-strongswan.sh
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}

      - name: Prepare AmneziaWG (rename native libs to coexist with WG)
        run: ./scripts/prepare-amneziawg.sh

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Android Lint
        # Only lint :app - the :strongswan-lib wrapper is advisory (see its
        # build.gradle.kts) and triggering its lint would also force the
        # NDK configure step which is already covered by the build job.
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lint-results
          path: android/app/build/reports/lint-results-debug.html
          retention-days: 7
          if-no-files-found: ignore
