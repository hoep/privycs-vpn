# Privycs VPN Desktop Client Release
# Builds Wails v2 app for Linux, macOS, and Windows on version tags.
name: Desktop App Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '20'
  WAILS_VERSION: 'latest'

jobs:
  check-changes:
    # Decides per-OS whether to build. Three orthogonal booleans
    # (linux / macos / windows) so an _darwin.go-only change doesn't
    # rebuild Linux + Windows, an iptables-rule fix in
    # sinkhole_linux.go doesn't rebuild macOS, etc. The classifier
    # treats anything WITHOUT an OS-suffix or OS-specific path as
    # "shared" — those still rebuild all three (cross-platform
    # dispatcher / app.go / Wails frontend / go.mod / wails.json).
    # Explicit per-OS marker files
    # (desktop/latest_version_<os>.txt) let the user force a rebuild
    # of one OS without code changes (re-sign, refresh dep cache).
    runs-on: ubuntu-latest
    outputs:
      linux_changed:   ${{ steps.changes.outputs.linux }}
      macos_changed:   ${{ steps.changes.outputs.macos }}
      windows_changed: ${{ steps.changes.outputs.windows }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Classify desktop/ changes since last tag per target OS
        id: changes
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -1)
          if [ -z "$PREV_TAG" ]; then
            # First tag in repo or detached state — build all.
            echo "linux=true"   >> "$GITHUB_OUTPUT"
            echo "macos=true"   >> "$GITHUB_OUTPUT"
            echo "windows=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "${PREV_TAG}..HEAD" -- desktop/)
          if [ -z "$CHANGED" ]; then
            echo "linux=false"   >> "$GITHUB_OUTPUT"
            echo "macos=false"   >> "$GITHUB_OUTPUT"
            echo "windows=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Files changed in desktop/ since ${PREV_TAG}:"
          echo "$CHANGED" | sed 's/^/  /'

          # Patterns:
          #   *_darwin.go, *_macos.go, *_macos_*.go, build/darwin/**,
          #   latest_version_macos.txt -> macOS-only
          #   *_linux.go, *_linux_*.go (rare), build/linux/**,
          #   latest_version_linux.txt, *_unix.go (also macOS) -> Linux
          #   *_windows.go, *_win.go, build/windows/**,
          #   latest_version_windows.txt -> Windows-only
          #   *_unix.go is non-Windows -> Linux + macOS
          #   *_other.go has varying build tags ("!windows", "!linux"
          #   etc.); treat conservatively as shared so we never miss
          #   a rebuild. Adds a few wasted minutes when only an
          #   _other.go file changed but avoids breakage.
          MACOS_RE='(_darwin\.go$|_macos(\.go|_[^/]*\.go)$|^desktop/build/darwin/|^desktop/latest_version_macos\.txt$)'
          LINUX_RE='(_linux\.go$|_linux_[^/]*\.go$|_unix\.go$|^desktop/build/linux/|^desktop/latest_version_linux\.txt$)'
          WINDOWS_RE='(_windows\.go$|_windows_[^/]*\.go$|_win\.go$|^desktop/build/windows/|^desktop/latest_version_windows\.txt$)'
          # _unix.go targets non-Windows = Linux + macOS, so it also
          # counts as a macOS trigger.
          MACOS_EXTRA_RE='(_unix\.go$)'

          # "Shared" = any line that doesn't match any OS-specific
          # pattern. If even one shared file changed, every OS
          # rebuilds.
          SHARED=$(echo "$CHANGED" | grep -vE "${MACOS_RE}|${LINUX_RE}|${WINDOWS_RE}|${MACOS_EXTRA_RE}" || true)
          if [ -n "$SHARED" ]; then
            echo "Shared (cross-platform) file(s) changed — rebuilding all three:"
            echo "$SHARED" | sed 's/^/  /'
            echo "linux=true"   >> "$GITHUB_OUTPUT"
            echo "macos=true"   >> "$GITHUB_OUTPUT"
            echo "windows=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Only OS-specific files changed. Set each flag based on
          # whether any of its patterns matched.
          if echo "$CHANGED" | grep -qE "${LINUX_RE}"; then
            echo "linux=true"   >> "$GITHUB_OUTPUT"
          else
            echo "linux=false"  >> "$GITHUB_OUTPUT"
          fi
          if echo "$CHANGED" | grep -qE "${MACOS_RE}|${MACOS_EXTRA_RE}"; then
            echo "macos=true"   >> "$GITHUB_OUTPUT"
          else
            echo "macos=false"  >> "$GITHUB_OUTPUT"
          fi
          if echo "$CHANGED" | grep -qE "${WINDOWS_RE}"; then
            echo "windows=true" >> "$GITHUB_OUTPUT"
          else
            echo "windows=false" >> "$GITHUB_OUTPUT"
          fi

  build-linux:
    needs: check-changes
    if: needs.check-changes.outputs.linux_changed == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: desktop/go.sum
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libayatana-appindicator3-dev
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
      - name: Install frontend dependencies
        working-directory: desktop/frontend
        run: npm ci
      - name: Fetch GeoLite2 Country MMDB
        working-directory: desktop
        run: go run scripts/fetchgeoip/main.go
      - name: Build desktop app
        working-directory: desktop
        env:
          # Pro-tier license verifier — embed the ed25519 public key
          # whose private half lives in the gateway env (LemonSqueezy
          # webhook signer). Empty when the secret isn't set, in which
          # case VerifyLicenseKey rejects every key with
          # ErrLicenseEmptyPublic ("This build cannot validate license
          # keys") — fail-closed.
          LICENSE_PUBLIC_KEY_HEX: ${{ secrets.LICENSE_PUBLIC_KEY_HEX }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF" ]; then VERSION="dev"; fi
          ~/go/bin/wails build -ldflags "-X main.AppVersion=$VERSION -X main.licensePublicKeyHex=$LICENSE_PUBLIC_KEY_HEX"
      - name: Prepare artifacts
        run: |
          mv desktop/build/bin/privycs-vpn desktop/build/bin/privycs-vpn-linux-amd64
          chmod +x desktop/build/bin/privycs-vpn-linux-amd64
          cd desktop/build/bin && sha256sum privycs-vpn-linux-amd64 > privycs-vpn-linux-amd64.sha256
      - name: Build .deb package
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          cd desktop
          cp build/bin/privycs-vpn-linux-amd64 build/bin/privycs-vpn
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ] || echo "$VERSION" | grep -q '/'; then VERSION="0.0.1"; fi
          VERSION=$(echo "$VERSION" | tr -d '+')
          export VERSION
          ~/go/bin/nfpm package --packager deb --target build/bin/
          mv build/bin/*.deb build/bin/privycs-vpn-linux-amd64.deb 2>/dev/null || true
          if [ -f build/bin/privycs-vpn-linux-amd64.deb ]; then
            cd build/bin && sha256sum privycs-vpn-linux-amd64.deb > privycs-vpn-linux-amd64.deb.sha256
          fi
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: privycs-vpn-linux-amd64
          path: |
            desktop/build/bin/privycs-vpn-linux-amd64
            desktop/build/bin/privycs-vpn-linux-amd64.sha256
            desktop/build/bin/privycs-vpn-linux-amd64.deb
            desktop/build/bin/privycs-vpn-linux-amd64.deb.sha256
          if-no-files-found: ignore

  build-macos:
    needs: check-changes
    if: needs.check-changes.outputs.macos_changed == 'true'
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: desktop/go.sum
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
      - name: Install frontend dependencies
        working-directory: desktop/frontend
        run: npm ci
      - name: Fetch GeoLite2 Country MMDB
        working-directory: desktop
        run: go run scripts/fetchgeoip/main.go
      - name: Build desktop app
        working-directory: desktop
        env:
          GOARCH: ${{ matrix.arch }}
          # See linux build step for the rationale on this secret.
          LICENSE_PUBLIC_KEY_HEX: ${{ secrets.LICENSE_PUBLIC_KEY_HEX }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF" ]; then VERSION="dev"; fi
          ~/go/bin/wails build -platform darwin/${{ matrix.arch }} -ldflags "-X main.AppVersion=$VERSION -X main.licensePublicKeyHex=$LICENSE_PUBLIC_KEY_HEX"

      # === macOS code signing + notarization scaffold ===
      #
      # Activates automatically once these GitHub Secrets are populated:
      #   APPLE_DEV_ID_CERT_P12_BASE64   — Developer ID Application cert (.p12 → base64)
      #   APPLE_DEV_ID_CERT_PASSWORD     — Password for that .p12
      #   APPLE_TEAM_ID                  — 10-char team identifier (e.g. ABCDE12345)
      #   APPLE_KEYCHAIN_PASSWORD        — Any string; protects the temp keychain
      #   APPLE_NOTARY_API_KEY_BASE64    — App Store Connect API key (.p8 → base64)
      #   APPLE_NOTARY_API_KEY_ID        — 10-char key ID
      #   APPLE_NOTARY_API_ISSUER_ID     — UUID issuer ID
      #
      # Until those are set, every signing/notarization step is a no-op (silently
      # skipped via env.HAS_SIGNING / env.HAS_NOTARY checks). The legacy unsigned
      # .zip artifact still uploads as before, so existing release flows keep
      # working uninterrupted while the user enrolls in the Developer Program.
      #
      # Reference for the secret-to-env-flag pattern: GitHub Actions cannot
      # evaluate secrets directly inside `if:` conditions, so we materialise
      # presence as an env var on the job step level. The empty-string check
      # (`!= ''`) yields the literal string "true" or "false".
      - name: Detect signing secrets
        id: signing-detect
        env:
          HAS_SIGNING_CERT: ${{ secrets.APPLE_DEV_ID_CERT_P12_BASE64 != '' }}
          HAS_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_API_KEY_BASE64 != '' }}
        run: |
          echo "has_cert=$HAS_SIGNING_CERT" >> "$GITHUB_OUTPUT"
          echo "has_notary=$HAS_NOTARY_KEY" >> "$GITHUB_OUTPUT"
          if [ "$HAS_SIGNING_CERT" = "true" ]; then
            echo "Codesigning will run."
          else
            echo "Codesigning skipped (APPLE_DEV_ID_CERT_P12_BASE64 secret not set)."
          fi
          if [ "$HAS_NOTARY_KEY" = "true" ]; then
            echo "Notarization will run."
          else
            echo "Notarization skipped (APPLE_NOTARY_API_KEY_BASE64 secret not set)."
          fi

      - name: Import Developer ID certificate into temp keychain
        if: steps.signing-detect.outputs.has_cert == 'true'
        env:
          P12_BASE64: ${{ secrets.APPLE_DEV_ID_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEV_ID_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          # Materialise cert from base64 secret. Stored under /tmp which the
          # post-job cleanup step removes; we also `rm` it explicitly after
          # `security import` succeeds so it never lives longer than needed.
          echo "$P12_BASE64" | base64 -d > /tmp/dev-id.p12
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # 6h timeout protects against multi-arch matrix runs racing.
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security import /tmp/dev-id.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          # Allow codesign to read the key without UI prompt (CI has no UI).
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm -f /tmp/dev-id.p12
          echo "BUILD_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Codesign app bundle (Developer ID, Hardened Runtime)
        if: steps.signing-detect.outputs.has_cert == 'true'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          APP="desktop/build/bin/privycs-vpn.app"
          ENTITLEMENTS="desktop/build/darwin/entitlements.plist"
          # The signing identity name matches the cert's common name. We
          # filter `security find-identity` to the team-id-suffixed entry
          # so multi-cert keychains don't pick the wrong one.
          IDENTITY="Developer ID Application: (${TEAM_ID})"
          REAL_IDENTITY=$(security find-identity -v -p codesigning "$BUILD_KEYCHAIN_PATH" \
                          | awk '/Developer ID Application/ {print $2; exit}')
          if [ -z "$REAL_IDENTITY" ]; then
            echo "ERROR: no Developer ID Application identity found in keychain"
            security find-identity -v -p codesigning "$BUILD_KEYCHAIN_PATH"
            exit 1
          fi
          echo "Signing with identity: $REAL_IDENTITY"
          # --deep signs everything inside the bundle (frameworks, helpers, etc).
          # --options runtime enables Hardened Runtime which is mandatory for
          # notarization on macOS 10.14.5+.
          # --timestamp embeds a secure timestamp; without it notarization
          # rejects the binary.
          codesign --force --deep --options runtime --timestamp \
            --sign "$REAL_IDENTITY" \
            --entitlements "$ENTITLEMENTS" \
            "$APP"
          # Verify before continuing — catches missing entitlements or
          # broken signatures BEFORE we waste 5-10 min on notarize.
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Package as zip
        run: |
          cd desktop/build/bin
          ARCHIVE="privycs-vpn-darwin-${{ matrix.arch }}.zip"
          ditto -c -k --keepParent privycs-vpn.app "$ARCHIVE" 2>/dev/null || zip -r "$ARCHIVE" privycs-vpn.app
          shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256"

      - name: Install create-dmg
        if: steps.signing-detect.outputs.has_cert == 'true'
        run: brew install create-dmg

      - name: Build DMG installer
        if: steps.signing-detect.outputs.has_cert == 'true'
        run: |
          set -euo pipefail
          cd desktop/build/bin
          DMG="privycs-vpn-darwin-${{ matrix.arch }}.dmg"
          # create-dmg builds a polished .dmg with a styled background +
          # /Applications symlink for drag-to-install. The window-size /
          # icon-size arguments tune the visual layout; tweak in iteration.
          create-dmg \
            --volname "Privycs VPN" \
            --window-size 540 380 \
            --icon-size 96 \
            --icon "privycs-vpn.app" 140 180 \
            --hide-extension "privycs-vpn.app" \
            --app-drop-link 400 180 \
            --no-internet-enable \
            "$DMG" \
            "privycs-vpn.app"
          shasum -a 256 "$DMG" > "${DMG}.sha256"

      - name: Codesign DMG
        if: steps.signing-detect.outputs.has_cert == 'true'
        run: |
          set -euo pipefail
          cd desktop/build/bin
          DMG="privycs-vpn-darwin-${{ matrix.arch }}.dmg"
          REAL_IDENTITY=$(security find-identity -v -p codesigning "$BUILD_KEYCHAIN_PATH" \
                          | awk '/Developer ID Application/ {print $2; exit}')
          codesign --force --sign "$REAL_IDENTITY" --timestamp "$DMG"

      - name: Notarize DMG
        if: steps.signing-detect.outputs.has_notary == 'true'
        env:
          API_KEY_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          cd desktop/build/bin
          DMG="privycs-vpn-darwin-${{ matrix.arch }}.dmg"
          # API-key auth (preferred) — no Apple ID password in CI.
          mkdir -p ~/private_keys
          echo "$API_KEY_BASE64" | base64 -d > "$HOME/private_keys/AuthKey_${API_KEY_ID}.p8"
          # Submit + wait for verdict (5-15 min typical). --wait blocks until
          # Apple finishes, which is what we want in CI; an async submission
          # would require a separate poll loop.
          xcrun notarytool submit "$DMG" \
            --key "$HOME/private_keys/AuthKey_${API_KEY_ID}.p8" \
            --key-id "$API_KEY_ID" \
            --issuer "$API_ISSUER_ID" \
            --wait \
            --timeout 30m
          # Staple the notarization ticket directly into the DMG so Gatekeeper
          # can verify offline — without this, first-run on a machine that's
          # never seen the binary would require a network round-trip to Apple.
          xcrun stapler staple "$DMG"
          # Re-sha after stapling — the sha256 from create-dmg step is stale
          # because stapler modifies the file in place.
          shasum -a 256 "$DMG" > "${DMG}.sha256"
          rm -f "$HOME/private_keys/AuthKey_${API_KEY_ID}.p8"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: privycs-vpn-darwin-${{ matrix.arch }}
          path: |
            desktop/build/bin/privycs-vpn-darwin-${{ matrix.arch }}.zip
            desktop/build/bin/privycs-vpn-darwin-${{ matrix.arch }}.zip.sha256
            desktop/build/bin/privycs-vpn-darwin-${{ matrix.arch }}.dmg
            desktop/build/bin/privycs-vpn-darwin-${{ matrix.arch }}.dmg.sha256
          if-no-files-found: ignore

  build-windows:
    needs: check-changes
    if: needs.check-changes.outputs.windows_changed == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: desktop/go.sum
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
      - name: Install frontend dependencies
        working-directory: desktop/frontend
        run: npm ci
      - name: Install NSIS
        run: choco install nsis -y
      - name: Fetch GeoLite2 Country MMDB
        working-directory: desktop
        run: go run scripts/fetchgeoip/main.go
      - name: Fetch wintun.dll
        shell: pwsh
        # AmneziaWG on Windows runs in-process via amneziawg-go, which
        # uses Wintun. wintun.dll must sit next to privycs-vpn.exe (or
        # in System32). We download the official build from wintun.net
        # and ship the amd64 DLL in the binary artifact + NSIS
        # installer. Pinned 0.14.1 — last release at time of writing.
        #
        # MUST run BEFORE `wails build -nsis` — the NSIS installer
        # bakes its payload at compile time, so the DLL has to be in
        # build/bin/ when makensis is invoked. v0.9.15.10 caught this:
        # earlier order had Fetch AFTER wails build, so the installer
        # shipped without wintun.dll → AmneziaWG broken for setup.exe
        # users.
        run: |
          New-Item -ItemType Directory -Force -Path desktop/build/bin | Out-Null
          $wintunZip = "$env:TEMP\wintun.zip"
          Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile $wintunZip
          $extractDir = "$env:TEMP\wintun-extracted"
          Expand-Archive -Path $wintunZip -DestinationPath $extractDir -Force
          $dll = Join-Path $extractDir "wintun\bin\amd64\wintun.dll"
          if (-not (Test-Path $dll)) { throw "wintun.dll not found at $dll after extraction" }
          Copy-Item $dll desktop/build/bin/wintun.dll
          Write-Host "wintun.dll staged in build/bin/ for the NSIS installer to pick up"
      - name: Build desktop app with NSIS installer
        working-directory: desktop
        env:
          # See linux build step for the rationale on this secret.
          LICENSE_PUBLIC_KEY_HEX: ${{ secrets.LICENSE_PUBLIC_KEY_HEX }}
        run: |
          $env:PATH = "$env:USERPROFILE\go\bin;C:\Program Files (x86)\NSIS;$env:PATH"
          $version = "$env:GITHUB_REF" -replace 'refs/tags/', ''
          if (-not $version) { $version = "dev" }
          wails build -platform windows/amd64 -nsis -ldflags "-X main.AppVersion=$version -X main.licensePublicKeyHex=$env:LICENSE_PUBLIC_KEY_HEX"
      - name: Prepare artifacts
        shell: pwsh
        run: |
          Copy-Item desktop/build/bin/privycs-vpn.exe desktop/build/bin/privycs-vpn-windows-amd64.exe
          cd desktop/build/bin
          Get-FileHash privycs-vpn-windows-amd64.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  privycs-vpn-windows-amd64.exe" } | Out-File -Encoding ASCII privycs-vpn-windows-amd64.exe.sha256
          $installer = Get-ChildItem -Path . -Filter "*installer.exe" -Recurse | Select-Object -First 1
          if ($installer) {
            Copy-Item $installer.FullName "privycs-vpn-windows-amd64-setup.exe"
            Get-FileHash "privycs-vpn-windows-amd64-setup.exe" -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  privycs-vpn-windows-amd64-setup.exe" } | Out-File -Encoding ASCII "privycs-vpn-windows-amd64-setup.exe.sha256"
          }
      - name: Upload standalone binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: privycs-vpn-windows-amd64
          path: |
            desktop/build/bin/privycs-vpn-windows-amd64.exe
            desktop/build/bin/privycs-vpn-windows-amd64.exe.sha256
            desktop/build/bin/wintun.dll
      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: privycs-vpn-windows-amd64-setup
          path: |
            desktop/build/bin/privycs-vpn-windows-amd64-setup.exe
            desktop/build/bin/privycs-vpn-windows-amd64-setup.exe.sha256
          if-no-files-found: ignore

  release:
    needs: [check-changes, build-linux, build-macos, build-windows]
    # Run when AT LEAST ONE OS actually built. If all three were
    # skipped (no desktop changes at all) the propagate job below
    # handles the release on its own.
    if: |
      always()
      && (needs.check-changes.outputs.linux_changed   == 'true'
          || needs.check-changes.outputs.macos_changed == 'true'
          || needs.check-changes.outputs.windows_changed == 'true')
      && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Privycs VPN ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: |
            artifacts/privycs-vpn-linux-amd64/*
            artifacts/privycs-vpn-darwin-amd64/*
            artifacts/privycs-vpn-darwin-arm64/*
            artifacts/privycs-vpn-windows-amd64/*
            artifacts/privycs-vpn-windows-amd64-setup/*
          fail_on_unmatched_files: false

  propagate-previous-desktop:
    # Propagate per-OS. When at least one OS skipped its build (its
    # path-gate flag = false), this job walks recent releases, picks
    # the newest one with that OS's assets, and re-attaches them to
    # the current tag's release so the user always sees a complete
    # set of binaries on every release page.
    #
    # Runs in parallel with the release job — one creates the
    # release with freshly-built artefacts, the other uploads
    # propagated artefacts for the OSes that didn't rebuild. Both
    # tolerate the release already existing (gh release create is
    # gated on existence; gh release upload appends).
    name: Propagate previous desktop assets
    # v0.9.15.44: depend on `release` so softprops/action-gh-release
    # creates the GH release first; we then append propagated
    # assets via `gh release upload`. Prior parallel-execution
    # raced the propagate job's `gh release create` against
    # softprops's create → softprops errored with 422 already_exists
    # on its finalisation step ("error finalizing release: ...
    # already_exists"). The serial order is safe: release runs
    # always() too, so even if it failed propagate still proceeds.
    needs: [check-changes, build-linux, build-macos, build-windows, release]
    if: |
      always()
      && (needs.check-changes.outputs.linux_changed   == 'false'
          || needs.check-changes.outputs.macos_changed == 'false'
          || needs.check-changes.outputs.windows_changed == 'false')
      && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (for gh CLI auth context)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Find previous tag with desktop assets and re-attach them
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          # Per-OS skip markers — see check-changes job. Each is the
          # string "true" or "false". When false, that OS rebuilt
          # this tag and we must NOT propagate (we'd shadow the fresh
          # build with stale assets); when true, that OS skipped and
          # we DO want to fetch its assets from the prior release.
          LINUX_SKIPPED:   ${{ needs.check-changes.outputs.linux_changed   == 'false' && 'true' || 'false' }}
          MACOS_SKIPPED:   ${{ needs.check-changes.outputs.macos_changed   == 'false' && 'true' || 'false' }}
          WINDOWS_SKIPPED: ${{ needs.check-changes.outputs.windows_changed == 'false' && 'true' || 'false' }}
        run: |
          set -euo pipefail

          echo "Per-OS propagate plan: linux=$LINUX_SKIPPED macos=$MACOS_SKIPPED windows=$WINDOWS_SKIPPED"

          # Per-OS asset regex used to (a) detect the prior release's
          # assets while picking PREV_TAG and (b) build the per-OS
          # download list later. Each OS gets its own regex so we
          # don't drag a Linux-only previous release's macOS-asset
          # absence into the picker.
          LINUX_RE='privycs-vpn-linux-amd64(\.sha256|\.deb(\.sha256)?)?$'
          MACOS_RE='privycs-vpn-darwin-(amd64|arm64)\.(zip|dmg)(\.sha256)?$'
          WINDOWS_RE='privycs-vpn-windows-amd64(-setup)?\.exe(\.sha256)?$'

          # Combined regex used by the wait-for-prior-build poll
          # (any desktop asset means the prior tag is no longer
          # mid-flight). Keep narrow so an android-only release
          # doesn't satisfy it.
          ASSET_RE="(${LINUX_RE}|${MACOS_RE}|${WINDOWS_RE})"

          # SEMVER-SORTED tag list. sort -rV picks the highest-version
          # prior tag that has the OS's assets, ignoring
          # release-creation-time ordering (which would race against
          # in-flight builds of a numerically-earlier tag whose
          # release was just created).
          TAGS=$(gh release list --repo "$REPO" --limit 50 --json tagName --jq '.[].tagName' \
                 | grep -v "^${CURRENT_TAG}$" \
                 | sort -rV || true)

          # find_prev_tag_for_os: walks $TAGS, returns the newest one
          # whose release carries an asset matching $1 (a per-OS
          # regex). Returns empty string when none found within 50
          # most-recent releases. Includes the in-flight wait so a
          # parallel desktop-release that started moments ago doesn't
          # cause us to skip its eventual assets.
          find_prev_tag_for_os() {
            local re="$1"
            local label="$2"
            local tag
            for tag in $TAGS; do
              local has=$(gh release view "$tag" --repo "$REPO" \
                          --json assets --jq '.assets[].name' 2>/dev/null \
                          | grep -cE "$re" || true)
              if [ "$has" -gt 0 ]; then
                echo "$tag"
                return 0
              fi
              # Wait for in-flight builds: if a desktop-release for
              # this tag is still running, give it up to 10 min.
              local running=$(gh run list --repo "$REPO" \
                              --workflow=desktop-release.yml \
                              --json databaseId,status,headBranch,event \
                              --jq ".[] | select(.headBranch==\"$tag\" and (.status==\"in_progress\" or .status==\"queued\")) | .databaseId" \
                              2>/dev/null | head -1)
              if [ -n "$running" ]; then
                echo "  ($label) tag $tag has in-flight build $running — waiting up to 10 min" >&2
                local deadline=$(( $(date +%s) + 600 ))
                while [ "$(date +%s)" -lt "$deadline" ]; do
                  has=$(gh release view "$tag" --repo "$REPO" \
                        --json assets --jq '.assets[].name' 2>/dev/null \
                        | grep -cE "$re" || true)
                  if [ "$has" -gt 0 ]; then
                    echo "$tag"
                    return 0
                  fi
                  sleep 30
                done
                echo "  ($label) wait timed out for $tag — moving on" >&2
              fi
            done
            echo ""
          }

          mkdir -p /tmp/desktop-assets

          # Per-OS download. Each OS finds its own prev-tag with that
          # OS's assets — necessary because a prior tag might have
          # only rebuilt one OS, so different OSes can map to
          # different prev-tags. Download patterns scoped per OS so
          # we never accidentally pull a different OS's binary into
          # the folder.
          if [ "$LINUX_SKIPPED" = "true" ]; then
            PREV=$(find_prev_tag_for_os "$LINUX_RE" "linux")
            if [ -n "$PREV" ]; then
              echo "Linux: propagating from $PREV"
              gh release download "$PREV" --repo "$REPO" --dir /tmp/desktop-assets \
                --pattern "privycs-vpn-linux-amd64" \
                --pattern "privycs-vpn-linux-amd64.sha256" \
                --pattern "privycs-vpn-linux-amd64.deb" \
                --pattern "privycs-vpn-linux-amd64.deb.sha256" \
                || true
            else
              echo "Linux: no prior release with Linux assets — skipping propagation"
            fi
          fi

          if [ "$MACOS_SKIPPED" = "true" ]; then
            PREV=$(find_prev_tag_for_os "$MACOS_RE" "macos")
            if [ -n "$PREV" ]; then
              echo "macOS: propagating from $PREV"
              gh release download "$PREV" --repo "$REPO" --dir /tmp/desktop-assets \
                --pattern "privycs-vpn-darwin-amd64.zip" \
                --pattern "privycs-vpn-darwin-amd64.zip.sha256" \
                --pattern "privycs-vpn-darwin-arm64.zip" \
                --pattern "privycs-vpn-darwin-arm64.zip.sha256" \
                --pattern "privycs-vpn-darwin-amd64.dmg" \
                --pattern "privycs-vpn-darwin-amd64.dmg.sha256" \
                --pattern "privycs-vpn-darwin-arm64.dmg" \
                --pattern "privycs-vpn-darwin-arm64.dmg.sha256" \
                || true
            else
              echo "macOS: no prior release with macOS assets — skipping propagation"
            fi
          fi

          if [ "$WINDOWS_SKIPPED" = "true" ]; then
            PREV=$(find_prev_tag_for_os "$WINDOWS_RE" "windows")
            if [ -n "$PREV" ]; then
              echo "Windows: propagating from $PREV"
              gh release download "$PREV" --repo "$REPO" --dir /tmp/desktop-assets \
                --pattern "privycs-vpn-windows-amd64.exe" \
                --pattern "privycs-vpn-windows-amd64.exe.sha256" \
                --pattern "privycs-vpn-windows-amd64-setup.exe" \
                --pattern "privycs-vpn-windows-amd64-setup.exe.sha256" \
                || true
            else
              echo "Windows: no prior release with Windows assets — skipping propagation"
            fi
          fi

          echo "Downloaded files:"
          ls -la /tmp/desktop-assets/ || true

          # Ensure the current release exists. The release job above
          # might have skipped (no OS rebuilt) or might be running in
          # parallel (some OSes rebuilt, others propagated). Other
          # workflows (e.g. android-release) may have created the
          # release already. softprops/action-gh-release is
          # idempotent, but gh release upload needs the release to
          # exist before we can attach files.
          if ! gh release view "$CURRENT_TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $CURRENT_TAG does not exist yet — creating it."
            gh release create "$CURRENT_TAG" \
              --repo "$REPO" \
              --title "Privycs VPN $CURRENT_TAG" \
              --generate-notes || echo "Race: release was created by another job just now."
          else
            echo "Release $CURRENT_TAG already exists — uploading to it."
          fi

          # Upload every downloaded file. If the current release already has
          # an asset with the same name (shouldn't, desktop and android asset
          # names are disjoint), --clobber overwrites.
          if compgen -G "/tmp/desktop-assets/*" > /dev/null; then
            echo "Uploading propagated desktop assets to $CURRENT_TAG..."
            gh release upload "$CURRENT_TAG" \
              --repo "$REPO" \
              --clobber \
              /tmp/desktop-assets/*
            echo "Propagated $(ls /tmp/desktop-assets/ | wc -l) desktop asset(s) to $CURRENT_TAG."
          else
            echo "Download folder is empty — every skipped OS lacked a prior release with assets, or no OS was actually skipped."
          fi
