name: iOS Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Path-Gate: Tag-pushes only trigger iOS-build when ios/ tree
# changed since the previous tag — analog desktop-release.yml's
# check-changes pattern.
jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      ios_changed: ${{ steps.check.outputs.ios_changed }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        run: |
          VERSION=$(cat ios/latest_version.txt 2>/dev/null | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - id: check
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${{ github.ref }}^" 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            echo "ios_changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          # Gate on ios/latest_version.txt (the iOS version file), NOT a raw
          # ios/ diff — per the documented per-OS version-file pattern. A raw
          # ios/ diff made every DESKTOP tag (v1.0.7.x) rebuild iOS too,
          # because iOS source fixes land on main between iOS releases; the
          # rebuild reused the unchanged build number and TestFlight rejected
          # the duplicate (v1.0.7.8 failed exactly here). Building + uploading
          # to TestFlight must require a deliberate iOS version bump, which
          # also honors "no iOS release until feature parity".
          if git diff --name-only "$PREV_TAG" "${{ github.ref }}" | grep -q '^ios/latest_version.txt$'; then
            echo "ios_changed=true" >> $GITHUB_OUTPUT
          else
            echo "ios_changed=false" >> $GITHUB_OUTPUT
          fi

  build-ios:
    needs: check-changes
    if: needs.check-changes.outputs.ios_changed == 'true'
    # macos-26 carries Xcode 26 + iOS 26 SDK — Apple has been enforcing
    # iOS 26 SDK as the minimum for App Store / TestFlight uploads since
    # April 2026. macos-15 only has Xcode 16 + iOS 18 SDK which Apple
    # now rejects in altool validation.
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # macos-26 runner ships Xcode 26.x; pick the highest installed.
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            XCODE=/Applications/Xcode_26.app
          fi
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Ensure iOS SDK is installed
        run: |
          # Xcode 16.0 on GitHub macos-15 sometimes ships without the iOS
          # device platform SDK, only the simulator runtime. `-downloadPlatform`
          # is the canonical fix; if everything is already there it no-ops.
          sudo xcodebuild -runFirstLaunch || true
          xcodebuild -downloadPlatform iOS || true
          xcodebuild -showsdks | grep -i ios || true

      - name: Install XcodeGen + Go toolchain
        run: |
          brew install xcodegen
          # Go is needed by the WireGuardKitGo Makefile (libwg-go.a)
          if ! command -v go >/dev/null; then
            brew install go
          fi
          go version

      - name: Prepare WireGuardKit (clone + patch + build libwg-go.a)
        working-directory: ios
        run: |
          set -euo pipefail
          # 1. Clone amnezia-vpn/amneziawg-apple to ios/.deps/wireguard-apple.
          #    This fork exposes the SAME `WireGuardKit` module + WireGuardAdapter
          #    as upstream zx2c4, but its libwg-go.a is built from amneziawg-go,
          #    so the one backend runs BOTH vanilla WireGuard (no AWG keys) AND
          #    AmneziaWG (Jc/Jmin/Jmax/S1-4/H1-4/I1-5 obfuscation). Mirrors
          #    Android's unified amneziawg GoBackend — both iOS bridges use it.
          PIN="5cbc86f38466ff763e24167bebc2640d6c30e7fe"
          mkdir -p .deps
          rm -rf .deps/wireguard-apple
          git clone https://github.com/amnezia-vpn/amneziawg-apple .deps/wireguard-apple
          (cd .deps/wireguard-apple && git checkout "$PIN")

          # 2a. Normalise Package.swift swift-tools-version to 5.5 (the
          #     amnezia fork is already 5.5; this is a harmless no-op kept
          #     for robustness if a future pin regresses).
          sed -i '' '1s|.*|// swift-tools-version:5.5|' .deps/wireguard-apple/Package.swift
          echo "Patched Package.swift first line:"
          head -1 .deps/wireguard-apple/Package.swift

          # 2b. Patch WireGuardKitC.h to include <sys/types.h>.
          #     The header uses u_int32_t / u_char / u_int16_t but does
          #     not include the system header that declares them.
          #     Strict Clang modules on Xcode 16 reject the implicit
          #     declarations. Mullvad's fork already has this fix.
          HEADER=.deps/wireguard-apple/Sources/WireGuardKitC/WireGuardKitC.h
          if ! grep -q '<sys/types.h>' "$HEADER"; then
            awk '/^#include "x25519.h"/ { print; print "#include <sys/types.h>"; next } { print }' "$HEADER" > "$HEADER.tmp"
            # Fail loud if the anchor regex didn't match (upstream rename
            # would silently produce an unchanged file).
            if ! grep -q '<sys/types.h>' "$HEADER.tmp"; then
              echo "ERROR: WireGuardKitC.h patch did not match — upstream layout changed" >&2
              exit 1
            fi
            mv "$HEADER.tmp" "$HEADER"
            echo "Patched WireGuardKitC.h to include <sys/types.h>:"
            head -8 "$HEADER"
          fi

          # 3. Build libwg-go.a for iOS arm64.
          #    Makefile reads PLATFORM_NAME + ARCHS + DESTDIR + the
          #    deployment-target trio (CFLAGS_PREFIX) from env. Without
          #    IPHONEOS_DEPLOYMENT_TARGET + DEPLOYMENT_TARGET_CLANG_FLAG_NAME
          #    + DEPLOYMENT_TARGET_CLANG_ENV_NAME, libwg-go.a gets tagged
          #    with min-iOS == the SDK default (26.5 on macos-26). Then
          #    Release+VALIDATE_PRODUCT archive promotes the "built for
          #    newer iOS" linker warning to a fatal error — this was
          #    the actual root cause of v1.0.7-alpha.18's failure (the
          #    UIUtilities message was downstream noise).
          mkdir -p /tmp/wg-out
          cd .deps/wireguard-apple/Sources/WireGuardKitGo
          PLATFORM_NAME=iphoneos \
            ARCHS=arm64 \
            IPHONEOS_DEPLOYMENT_TARGET=17.0 \
            DEPLOYMENT_TARGET_CLANG_FLAG_NAME=mios-version-min \
            DEPLOYMENT_TARGET_CLANG_ENV_NAME=IPHONEOS_DEPLOYMENT_TARGET \
            SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)" \
            DESTDIR=/tmp/wg-out \
            CONFIGURATION_BUILD_DIR=/tmp/wg-out \
            CONFIGURATION_TEMP_DIR=/tmp/wg-out/tmp \
            make build
          echo "libwg-go.a built:"
          ls -la /tmp/wg-out/libwg-go.a

      - name: Generate .xcodeproj
        working-directory: ios
        env:
          PRIVYCS_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: xcodegen generate

      - name: Resolve Swift Packages
        working-directory: ios
        run: xcodebuild -resolvePackageDependencies -project PrivycsVPN.xcodeproj

      - name: Decode signing certificate
        env:
          P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12_PASSWORD }}
        run: |
          mkdir -p ~/keychain
          echo "$P12_BASE64" | base64 -d > ~/keychain/dist.p12
          security create-keychain -p actions ~/Library/Keychains/build.keychain-db
          security default-keychain -s ~/Library/Keychains/build.keychain-db
          security unlock-keychain -p actions ~/Library/Keychains/build.keychain-db
          security set-keychain-settings -l -u ~/Library/Keychains/build.keychain-db
          security import ~/keychain/dist.p12 -k ~/Library/Keychains/build.keychain-db \
            -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k actions ~/Library/Keychains/build.keychain-db

      - name: Install provisioning profiles
        env:
          PROFILE_APP_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_APP_BASE64 }}
          PROFILE_TUNNEL_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_TUNNEL_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_APP_BASE64" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/app.mobileprovision
          echo "$PROFILE_TUNNEL_BASE64" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/tunnel.mobileprovision

      - name: Archive
        working-directory: ios
        env:
          LICENSE_PUBLIC_KEY_HEX: ${{ secrets.LICENSE_PUBLIC_KEY_HEX }}
        run: |
          xcodebuild archive \
            -project PrivycsVPN.xcodeproj \
            -scheme PrivycsVPN \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/PrivycsVPN.xcarchive \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGN_STYLE=Manual \
            LIBRARY_SEARCH_PATHS='$(inherited) /tmp/wg-out' \
            LICENSE_PUBLIC_KEY_HEX="${LICENSE_PUBLIC_KEY_HEX}" \
            -allowProvisioningUpdates

      - name: Export IPA
        working-directory: ios
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>uploadSymbols</key><true/>
            <key>uploadBitcode</key><false/>
            <key>teamID</key><string>__TEAM_ID__</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.privycs.vpn</key><string>Privycs VPN App Store</string>
              <key>com.privycs.vpn.tunnel</key><string>Privycs VPN Tunnel App Store</string>
            </dict>
          </dict></plist>
          EOF
          sed -i '' "s|__TEAM_ID__|${TEAM_ID}|" ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath build/PrivycsVPN.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/IPA

      - name: Rename IPA + generate checksum
        run: |
          cd ios/build/IPA
          VERSION="${{ needs.check-changes.outputs.version }}"
          mv PrivycsVPN.ipa "privycs-vpn-ios-${VERSION}.ipa"
          shasum -a 256 "privycs-vpn-ios-${VERSION}.ipa" > "privycs-vpn-ios-${VERSION}.ipa.sha256"

      - name: Upload to TestFlight
        env:
          NOTARY_KEY_B64: ${{ secrets.APPLE_NOTARY_API_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$NOTARY_KEY_B64" | base64 -d > ~/.appstoreconnect/private_keys/AuthKey_$NOTARY_KEY_ID.p8
          VERSION="${{ needs.check-changes.outputs.version }}"
          xcrun altool --upload-app \
            -f "ios/build/IPA/privycs-vpn-ios-${VERSION}.ipa" \
            -t ios \
            --apiKey "$NOTARY_KEY_ID" \
            --apiIssuer "$NOTARY_ISSUER_ID"

      # Set the TestFlight "What to Test" notes (en-US) for the build we just
      # uploaded, via the App Store Connect API — same key as altool above, no
      # new secret. Best-effort: never blocks the release (continue-on-error +
      # the script exits 0 on any soft failure / build-processing timeout).
      - name: Set TestFlight What-to-Test notes
        continue-on-error: true
        env:
          NOTARY_KEY_B64: ${{ secrets.APPLE_NOTARY_API_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -uo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          KEY_FILE="$HOME/.appstoreconnect/private_keys/AuthKey_${NOTARY_KEY_ID}.p8"
          echo "$NOTARY_KEY_B64" | base64 -d > "$KEY_FILE"
          BUILD=$(grep 'CURRENT_PROJECT_VERSION' ios/project.yml | grep -oE '[0-9]+' | head -1)
          echo "Setting What-to-Test for build number: $BUILD"
          python3 -m pip install --quiet "pyjwt[crypto]" \
            || python3 -m pip install --quiet --break-system-packages "pyjwt[crypto]" || true
          python3 ios/scripts/set_testflight_notes.py \
            "$BUILD" "com.privycs.vpn" "ios/TestFlight/WhatToTest.en-US.txt" \
            "$KEY_FILE" "$NOTARY_KEY_ID" "$NOTARY_ISSUER_ID"

      - name: Upload workflow artefact
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ needs.check-changes.outputs.version }}
          path: |
            ios/build/IPA/*.ipa
            ios/build/IPA/*.ipa.sha256

      - name: Attach IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Privycs VPN ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            ios/build/IPA/*.ipa
            ios/build/IPA/*.ipa.sha256

  propagate-previous-ios:
    name: Propagate previous iOS IPA
    needs: [check-changes, build-ios]
    if: |
      always() &&
      needs.check-changes.outputs.ios_changed == 'false' &&
      startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Find previous tag with iOS IPA and re-attach
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Semver-sorted prior tag list (NOT creation-time ordered — avoids
          # racing an in-flight numerically-earlier build).
          TAGS=$(gh release list --repo "$REPO" --limit 50 --json tagName --jq '.[].tagName' \
                 | grep -v "^${CURRENT_TAG}$" | sort -rV)
          if [ -z "$TAGS" ]; then
            echo "No prior releases — nothing to propagate."
            exit 0
          fi
          IOS_RE='privycs-vpn-ios-.*\.ipa(\.sha256)?$'
          # Poll for in-flight prior runs up to 35 min — matches android-release's
          # wait_for_android_assets (a clean iOS archive + export + TestFlight upload
          # comfortably fits in 35 min).
          wait_for_ios_assets() {
            local tag="$1"
            local deadline=$(( $(date +%s) + 2100 ))
            while [ "$(date +%s)" -lt "$deadline" ]; do
              local count
              count=$(gh release view "$tag" --repo "$REPO" --json assets \
                      --jq ".assets[].name" 2>/dev/null \
                      | grep -cE "$IOS_RE" || true)
              if [ "$count" -gt 0 ]; then
                return 0
              fi
              sleep 30
            done
            return 1
          }
          PREV_TAG=""
          for tag in $TAGS; do
            count=$(gh release view "$tag" --repo "$REPO" --json assets \
                    --jq '.assets[].name' 2>/dev/null \
                    | grep -cE "$IOS_RE" || true)
            if [ "$count" -gt 0 ]; then
              PREV_TAG="$tag"
              break
            fi
            # In-flight check: if ios-release is still running on this tag, wait.
            running=$(gh run list --repo "$REPO" --workflow=ios-release.yml \
                      --json databaseId,status,headBranch \
                      --jq ".[] | select(.headBranch==\"$tag\" and (.status==\"in_progress\" or .status==\"queued\")) | .databaseId" \
                      | head -1)
            if [ -n "$running" ]; then
              echo "Tag $tag has an in-flight ios-release run — waiting up to 35 min for assets."
              if wait_for_ios_assets "$tag"; then
                PREV_TAG="$tag"
                break
              fi
            fi
          done
          if [ -z "$PREV_TAG" ]; then
            echo "No previous release with iOS IPA found — nothing to propagate."
            exit 0
          fi
          echo "Propagating iOS assets from $PREV_TAG → $CURRENT_TAG"
          mkdir -p /tmp/ios-assets
          gh release download "$PREV_TAG" --repo "$REPO" --dir /tmp/ios-assets \
            --pattern '*.ipa' --pattern '*.ipa.sha256'
          # Ensure current release exists (race-tolerant — desktop/android may
          # have already created it).
          if ! gh release view "$CURRENT_TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$CURRENT_TAG" --repo "$REPO" \
              --title "Privycs VPN $CURRENT_TAG" \
              --generate-notes \
              || echo "Race: release was created by another job just now."
          fi
          shopt -s nullglob
          ASSETS=(/tmp/ios-assets/*.ipa /tmp/ios-assets/*.ipa.sha256)
          if [ "${#ASSETS[@]}" -gt 0 ]; then
            gh release upload "$CURRENT_TAG" --repo "$REPO" --clobber "${ASSETS[@]}"
            echo "Propagated ${#ASSETS[@]} iOS asset(s) from $PREV_TAG."
          fi
