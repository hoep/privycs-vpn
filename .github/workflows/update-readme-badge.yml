name: Update README badges

# Bumps four per-platform shields.io badges in README.md (macOS,
# Linux, Windows, Android) to match the version pinned in their
# respective `latest_version*.txt` source-of-truth files. The single
# umbrella "release-vX.Y.Z-blue" badge from earlier privycs-vpn was
# misleading once we adopted the per-platform-versioning system in
# v0.9.14.56–.57: a tag like v0.9.14.69 might re-build only macOS
# (the OS that actually changed), with Linux/Windows/Android assets
# propagated unchanged from their last-bumped tags. The single badge
# would jump to .69 even though the Android user got .68's APK.
# Per-platform badges show what each user's binary actually claims.
#
# Static badges (vs shields.io's dynamic GH-API ones) are kept even
# now that the repo can go public, because shields.io can't read our
# version-text-file structure — only the GH release API. So this
# workflow stays as the badge-source-of-truth.

on:
  push:
    tags: ['v*']

# Need contents:write to commit the README update back to main.
permissions:
  contents: write

jobs:
  update-badges:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # We want to commit on main, not on the tag. fetch-depth: 0
          # so the subsequent push has the full history to fast-forward.
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update per-platform badges from version files
        id: bump
        run: |
          # Read each platform's pinned version. Source-of-truth lives
          # in the version files, NOT the tag, because per-OS
          # propagate-previous logic (desktop-release.yml /
          # android-release.yml) means a single tag may rebuild only
          # a subset of platforms. The version files only advance
          # when the corresponding platform was actually re-released.
          MACOS=$(tr -d '[:space:]' < desktop/latest_version_macos.txt)
          LINUX=$(tr -d '[:space:]' < desktop/latest_version_linux.txt)
          WINDOWS=$(tr -d '[:space:]' < desktop/latest_version_windows.txt)
          ANDROID=$(grep '^versionName=' android/latest_version.txt | cut -d= -f2 | tr -d '[:space:]')

          echo "macOS=v${MACOS} Linux=v${LINUX} Windows=v${WINDOWS} Android=v${ANDROID}"

          # The badge URL pattern is `<Platform>-v<version>-<colorhex>`
          # where colorhex is the brand colour we picked (kept stable
          # across releases so the regex anchor never needs touching).
          # Using `[0-9.]+` for the version because privycs-vpn tags
          # follow plain dotted-numeric semver — no letters, no `-rcN`
          # suffix. If we ever ship pre-releases this regex needs
          # broadening.
          sed -i -E "s|macOS-v[0-9.]+-000000|macOS-v${MACOS}-000000|g"     README.md
          sed -i -E "s|Linux-v[0-9.]+-FCC624|Linux-v${LINUX}-FCC624|g"     README.md
          sed -i -E "s|Windows-v[0-9.]+-0078D4|Windows-v${WINDOWS}-0078D4|g" README.md
          sed -i -E "s|Android-v[0-9.]+-3DDC84|Android-v${ANDROID}-3DDC84|g" README.md

          if git diff --quiet README.md; then
            echo "README badges already at current versions, nothing to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff README.md
          fi

      - name: Commit and push (with retry-on-race)
        if: steps.bump.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          # [skip ci] in the commit message prevents this workflow
          # from re-triggering on the resulting push (the trigger
          # is tag-push only, but defence-in-depth in case the
          # trigger gets broadened later).
          git commit -m "docs: bump README badges for ${GITHUB_REF_NAME} [skip ci]"

          # Retry-with-rebase loop. v0.9.14.17 hit the race on its
          # tag-push: a manual `git push origin main` + `git push
          # origin v0.9.14.17` from the developer machine landed on
          # main at the same moment this workflow's checkout snapshot
          # was taken. Result: workflow's local main was a commit
          # behind by the time it tried to push back, push rejected
          # with "cannot lock ref ... is at <newer-sha> but expected
          # <stale-sha>". Three-attempt rebase loop covers all
          # realistic concurrent-write windows.
          set +e
          for attempt in 1 2 3; do
            if git push origin main; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt failed (likely concurrent main update). Rebasing and retrying…"
            git fetch origin main
            # Rebase our single badge-bump commit onto the new tip.
            # Conflicts shouldn't happen — the badge-bump only touches
            # the four shields.io URL lines and concurrent commits
            # aren't likely to touch them. If they do, abort.
            if ! git rebase origin/main; then
              echo "Rebase conflict — aborting badge bump for this run."
              git rebase --abort || true
              exit 1
            fi
          done
          echo "Push failed after 3 attempts."
          exit 1
