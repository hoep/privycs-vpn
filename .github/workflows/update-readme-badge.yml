name: Update README badge

# Bumps the "release-vX.Y.Z" shields.io badge in README.md to match
# the latest pushed tag. Static badges are used (instead of dynamic
# shields.io GitHub-API queries) because the repo is private and
# shields.io can't authenticate against the GitHub API for private
# repos. Switch back to the dynamic ones when the repo is public
# and this workflow can be deleted.

on:
  push:
    tags: ['v*']

# Need contents:write to commit the README update back to main.
permissions:
  contents: write

jobs:
  update-badge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # We want to commit on main, not on the tag. fetch-depth: 0
          # so the subsequent push has the full history to fast-forward.
          ref: main
          fetch-depth: 0
          # Use a token that can push back. GITHUB_TOKEN with
          # contents:write does this.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update release badge to ${{ github.ref_name }}
        id: bump
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "Updating README badge to $TAG"
          # The badge URL pattern: release-vX.Y.Z-blue. The version
          # part may contain dots and digits and the v prefix; we
          # replace the WHOLE matched version segment between
          # "release-" and "-blue" so we don't depend on knowing
          # the previous version explicitly.
          sed -i -E \
            "s|release-v[0-9A-Za-z._-]+-blue|release-${TAG}-blue|g" \
            README.md
          # Detect whether sed actually changed anything. If the
          # README already has the new tag (rare, e.g. manual
          # update before tag push), we exit clean without an
          # empty commit.
          if git diff --quiet README.md; then
            echo "README badge already at $TAG, nothing to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push (with retry-on-race)
        if: steps.bump.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          # [skip ci] in the commit message prevents this workflow
          # from re-triggering on the resulting push (the trigger
          # is tag-push only, but defence-in-depth in case the
          # trigger gets broadened later).
          git commit -m "docs: bump README badge to ${GITHUB_REF_NAME} [skip ci]"

          # Retry-with-rebase loop. v0.9.14.17 hit the race on its
          # tag-push: a manual `git push origin main` + `git push
          # origin v0.9.14.17` from the developer machine landed on
          # main at the same moment this workflow's checkout snapshot
          # was taken. Result: workflow's local main was a commit
          # behind by the time it tried to push back, push rejected
          # with "cannot lock ref ... is at <newer-sha> but expected
          # <stale-sha>". Three-attempt rebase loop covers all
          # realistic concurrent-write windows.
          set +e
          for attempt in 1 2 3; do
            if git push origin main; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt failed (likely concurrent main update). Rebasing and retrying…"
            git fetch origin main
            # Rebase our single badge-bump commit onto the new tip.
            # Conflicts shouldn't happen — the badge-bump only touches
            # one line in README.md and concurrent commits aren't
            # likely to touch the same line. If they do, abort.
            if ! git rebase origin/main; then
              echo "Rebase conflict — aborting badge bump for this run."
              git rebase --abort || true
              exit 1
            fi
          done
          echo "Push failed after 3 attempts."
          exit 1
