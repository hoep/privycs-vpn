# Privycs VPN Desktop Client CI Build
# Builds Wails v2 app for Linux on every push/PR.
# Full cross-platform release builds triggered by tags.
name: Desktop Build

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'

# Least-privilege workflow token — build only needs to read source.
# v0.9.14.10 hardening per Aikido finding "Overly Broad Permissions".
permissions:
  contents: read

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.23'
          cache-dependency-path: desktop/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libayatana-appindicator3-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend dependencies
        working-directory: desktop/frontend
        run: npm ci

      - name: Fetch GeoLite2 Country MMDB
        run: go run scripts/fetchgeoip/main.go

      - name: Build desktop app
        run: ~/go/bin/wails build

      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: privycs-vpn-linux-amd64
          path: desktop/build/bin/privycs-vpn
          retention-days: 14
          if-no-files-found: ignore
