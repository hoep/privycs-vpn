# Privycs VPN Desktop Client CI Build
# Builds Wails v2 app for Linux on every push/PR.
# Full cross-platform release builds triggered by tags.
name: Desktop Build

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: desktop/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libayatana-appindicator3-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend dependencies
        working-directory: desktop/frontend
        run: npm ci

      - name: Build desktop app
        run: ~/go/bin/wails build

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: privycs-vpn-linux-amd64
          path: desktop/build/bin/privycs-vpn
          retention-days: 14
          if-no-files-found: ignore
