# Privycs VPN Desktop Client CI Build
# Builds Wails v2 app for Linux on every push/PR.
# Full cross-platform release builds triggered by tags.
name: Desktop Build

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'

# Least-privilege workflow token — build only needs to read source.
# v0.9.14.10 hardening per Aikido finding "Overly Broad Permissions".
permissions:
  contents: read

jobs:
  check-changes:
    # Only run the Linux smoke-test when the change actually affects
    # Linux. Files matching macOS-specific (_darwin.go, _macos.go,
    # _macos_*.go, build/darwin/**, latest_version_macos.txt) or
    # Windows-specific (_windows.go, _windows_*.go, build/windows/**,
    # latest_version_windows.txt) patterns alone don't need a Linux
    # build kicked off. Anything else under desktop/ — shared code,
    # frontend, go.mod, latest_version_linux.txt, _unix.go (which
    # also targets Linux) — does. Mirrors desktop-release's
    # classifier.
    runs-on: ubuntu-latest
    outputs:
      linux_changed: ${{ steps.changes.outputs.linux }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
      - name: Classify changes
        id: changes
        run: |
          # On push, compare against the parent commit. On PR,
          # compare against the merge-base of base..HEAD.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          else
            BASE_SHA="HEAD~1"
          fi

          CHANGED=$(git diff --name-only "$BASE_SHA" HEAD -- desktop/)
          if [ -z "$CHANGED" ]; then
            echo "linux=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MACOS_RE='(_darwin\.go$|_macos(\.go|_[^/]*\.go)$|^desktop/build/darwin/|^desktop/latest_version_macos\.txt$)'
          WINDOWS_RE='(_windows\.go$|_windows_[^/]*\.go$|_win\.go$|^desktop/build/windows/|^desktop/latest_version_windows\.txt$)'
          # Anything that's NOT exclusively macOS or Windows = relevant for Linux.
          NON_LINUX_ONLY=$(echo "$CHANGED" | grep -vE "${MACOS_RE}|${WINDOWS_RE}" || true)
          if [ -n "$NON_LINUX_ONLY" ]; then
            echo "linux=true" >> "$GITHUB_OUTPUT"
          else
            echo "linux=false" >> "$GITHUB_OUTPUT"
          fi

  build-linux:
    needs: check-changes
    if: needs.check-changes.outputs.linux_changed == 'true'
    name: Build Linux
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.23'
          cache-dependency-path: desktop/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libayatana-appindicator3-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend dependencies
        working-directory: desktop/frontend
        run: npm ci

      - name: Fetch GeoLite2 Country MMDB
        run: go run scripts/fetchgeoip/main.go

      - name: Build desktop app
        run: ~/go/bin/wails build

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: privycs-vpn-linux-amd64
          path: desktop/build/bin/privycs-vpn
          retention-days: 14
          if-no-files-found: ignore
