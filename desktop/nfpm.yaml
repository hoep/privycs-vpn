name: privycs-vpn
arch: amd64
platform: linux
version: "${VERSION}"
maintainer: "Privycs <info@privycs.com>"
description: "Privycs VPN Client - Multi-protocol VPN for WireGuard, OpenVPN, and IPSec"
vendor: "Privycs"
homepage: "https://privycs.com"
license: "Proprietary"

contents:
  - src: build/bin/privycs-vpn
    dst: /usr/local/bin/privycs-vpn
    file_info:
      mode: 0755

  - src: build/appicon.png
    dst: /usr/share/icons/hicolor/256x256/apps/privycs-vpn.png

  - src: build/privycs-vpn.desktop
    dst: /usr/share/applications/privycs-vpn.desktop

depends:
  - libgtk-3-0
  - libwebkit2gtk-4.0-0 | libwebkit2gtk-4.1-0
  - libayatana-appindicator3-1

# VPN protocol userland. Recommends (not Depends) so `apt install ./pkg.deb`
# pulls them in by default, but users who only use one protocol can drop the
# rest (`apt --no-install-recommends`) and dpkg -i still works without them.
# AmneziaWG (awg-quick) is NOT here — it has no package in the default Debian/
# Ubuntu repos; the install script / docs cover it separately.
recommends:
  - wireguard-tools
  - openvpn
  - strongswan
  - strongswan-swanctl
  - libcharon-extra-plugins

scripts:
  postinstall: build/postinstall.sh
  postremove: build/postremove.sh

# RPM (Fedora / RHEL / openSUSE) overrides. Everything above targets Debian,
# whose package names (libgtk-3-0, libwebkit2gtk-4.x-0, libayatana-…) exist on
# NO rpm distro — and Fedora and openSUSE disagree with each OTHER on the names
# too. So the hard runtime deps are expressed as SONAMEs instead: every rpm that
# ships a library auto-Provides its soname in exactly this
# `lib.so.N()(64bit)` form, so one string resolves on both distros without
# guessing package names. The sonames are the ones the ubuntu-22.04 build links
# (libwebkit2gtk-4.0-dev → .so.37); a CI step asserts the built binary really
# NEEDs each of them, so a soname drift (e.g. a runner bump to webkit 4.1) fails
# the build instead of shipping an uninstallable rpm.
#
# recommends are soft and the installer (scripts/install-linux.sh) pulls the VPN
# tools itself via dnf/zypper, so they carry the plain Fedora names purely as a
# hint. postinstall/postremove are shared: both are POSIX sh with command -v
# guards, nothing dpkg-specific.
overrides:
  rpm:
    depends:
      - "libgtk-3.so.0()(64bit)"
      - "libwebkit2gtk-4.0.so.37()(64bit)"
      - "libayatana-appindicator3.so.1()(64bit)"
    recommends:
      - wireguard-tools
      - openvpn
      - strongswan
