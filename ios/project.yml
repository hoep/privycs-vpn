# XcodeGen project specification — generate PrivycsVPN.xcodeproj
# from this YAML by running `xcodegen generate` from the ios/
# directory on a Mac with XcodeGen installed (`brew install xcodegen`).
#
# Rationale: Xcode's .pbxproj is a 5000+ line binary-flavoured plist
# that's painful to merge + diff. XcodeGen lets us treat the project
# layout as code — single source of truth, regeneratable, line-by-
# line diffable. Used by airbnb / Google for the same reasons.
name: PrivycsVPN
options:
  bundleIdPrefix: com.privycs.vpn
  deploymentTarget:
    # iOS 15 floor reaches older iPads (Air 2, mini 4, iPad 5, Pro 1st-gen).
    # The interactive Widget keeps its own 17.0 (App Intents / Button(intent:)
    # are iOS 17) so it's simply unavailable below 17 while the app runs fully.
    iOS: "15.0"
    tvOS: "17.0"
  developmentLanguage: en
  defaultConfig: Release
  groupSortPosition: bottom

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: "${PRIVYCS_TEAM_ID}"     # set via .env / CI secret
    CODE_SIGN_STYLE: Manual
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.1.5"                  # CFBundleShortVersionString — Apple allows at most 3 integers. Patch identity lives in the build number below.
    CURRENT_PROJECT_VERSION: "156"               # MUST increment every TestFlight upload; this is the patch build of marketing 1.1.3
    # ed25519 license pubkey hex — overridden by CI from the
    # LICENSE_PUBLIC_KEY_HEX secret; empty default for local builds.
    LICENSE_PUBLIC_KEY_HEX: ""
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: -Onone
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_OPTIMIZATION_LEVEL: -O
      VALIDATE_PRODUCT: YES

packages:
  PrivycsCore:
    path: Core
  WireGuardKit:
    # Upstream zx2c4/wireguard-apple cloned + patched locally by the
    # CI workflow (.github/workflows/ios-release.yml step "Prepare
    # WireGuardKit"). Two reasons for not consuming via URL:
    #   1. Upstream Package.swift declares `// swift-tools-version:5.3`
    #      but uses .macOS(.v12) / .iOS(.v15) — needs PackageDescription
    #      5.5. The pre-clone step patches the first line to 5.5.
    #   2. WireGuardKitGo .linkedLibrary("wg-go") expects libwg-go.a to
    #      exist on the linker search path. SPM cannot build it (Go
    #      toolchain not part of SPM build plugins). CI builds it via
    #      upstream's WireGuardKitGo/Makefile to /tmp/wg-out/.
    # Mullvad's fork was tried and rejected — it pulls maybenot + daita
    # (Mullvad-proprietary obfuscation libs) which need a Rust toolchain
    # and don't apply to our use case.
    path: .deps/wireguard-apple
  # Sentry temporarily removed for Xcode 26 alpha track —
  # see ios/Core/Package.swift comment.
  # Sentry:
  #   url: https://github.com/getsentry/sentry-cocoa
  #   from: 9.15.0
  OpenVPNAdapter:
    url: https://github.com/ss-abramchuk/OpenVPNAdapter
    from: 0.8.0
  # Smart Decision Engine (v1.0.9) — local SwiftPM wrapper around the gomobile
  # Engine.xcframework (engine/ffi), built by Scripts/build-engine-xcframework.sh
  # into ThirdParty/Engine/ (gitignored, rebuilt in CI). App target only.
  Engine:
    path: ThirdParty/Engine

targets:
  # ───── Main App ─────────────────────────────────────────────────
  PrivycsVPN:
    type: application
    platform: iOS
    sources:
      - path: App
    resources:
      - path: App/Resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Privycs VPN
        # Advertise all 6 localizations so their .lproj are bundled and the
        # in-app LanguageManager (Bundle swizzle) can load any of them.
        CFBundleLocalizations:
          - en
          - de
          - es
          - fr
          - it
          - pt
        LSApplicationCategoryType: public.app-category.utilities
        NSLocationWhenInUseUsageDescription: >
          Privycs uses your location only to read the current Wi-Fi
          name so On-Demand Network Rules can match against trusted
          SSIDs. No location coordinates are stored or transmitted.
        NSCameraUsageDescription: >
          Privycs uses the camera only to scan VPN-config QR codes you
          provide. No images are stored or transmitted.
        # "Send to Apple TV" (SendToTVView): the phone POSTs a config/backup to
        # the TV's LAN import server. Outgoing local-network access needs this
        # usage string; the cleartext-HTTP-to-LAN exception is scoped to the
        # local network only (ATS stays on for everything else).
        NSLocalNetworkUsageDescription: >
          Privycs uses the local network so you can send a VPN configuration or
          backup from this phone to your Apple TV. Nothing leaves your network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
        LicensePublicKeyHex: "$(LICENSE_PUBLIC_KEY_HEX)"
        UIBackgroundModes:
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.privycs.vpn.poolrotate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen:
          UIImageRespectsSafeAreaInsets: true
        # Design-system fonts — bundled under App/Resources/Fonts/
        # (Inter sans + Fira Code mono). Registered so Font.custom can
        # resolve them by PostScript name (see App/Theme/PrivycsFont.swift).
        UIAppFonts:
          - Inter-Regular.ttf
          - Inter-Medium.ttf
          - Inter-SemiBold.ttf
          - Inter-Bold.ttf
          - FiraCode-Regular.ttf
          - FiraCode-Medium.ttf
          - FiraCode-SemiBold.ttf
    entitlements:
      path: App/PrivycsVPN.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
          - app-proxy-provider
        com.apple.security.application-groups:
          - group.com.privycs.vpn
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.privycs.vpn
        com.apple.developer.networking.vpn.api:
          - allow-vpn
        com.apple.developer.networking.wifi-info: true
    dependencies:
      - package: PrivycsCore
      - package: Engine
        product: Engine
      # - package: Sentry        # temporarily removed, see packages: comment
      #   product: Sentry
      - target: PrivycsVPNTunnel
        embed: true
      - target: PrivycsVPNWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.privycs.vpn
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "Privycs VPN App Store"

  # ───── Packet Tunnel Extension ──────────────────────────────────
  PrivycsVPNTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: Tunnel
        # Both tunnel targets glob the shared Tunnel/ dir, and XcodeGen writes
        # each target's generated Info.plist INTO that dir. Exclude BOTH plists
        # from the source glob so the iOS target never picks up the tvOS plist
        # (and vice-versa) as a stray Copy-Bundle-Resources entry — which would
        # trip "Multiple commands produce .../Info.plist".
        excludes:
          - "Info.plist"
          - "InfoTV.plist"
    info:
      path: Tunnel/Info.plist
      properties:
        CFBundleDisplayName: Privycs VPN Tunnel
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PrivycsPacketTunnelProvider
    entitlements:
      path: Tunnel/PrivycsVPNTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        com.apple.security.application-groups:
          - group.com.privycs.vpn
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.privycs.vpn
    dependencies:
      - package: PrivycsCore
      - package: WireGuardKit
        product: WireGuardKit
      - package: OpenVPNAdapter
        product: OpenVPNAdapter
      # OpenVPNAdapter's openvpn::Reachability code uses
      # SCNetworkReachability* APIs from SystemConfiguration. The
      # upstream Package.swift doesn't declare this link, so we
      # add it here at the Tunnel target level.
      - sdk: SystemConfiguration.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.privycs.vpn.tunnel
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "Privycs VPN Tunnel App Store"

  # ───── Home-Screen Widget (WidgetKit) ───────────────────────────
  # In-place interactive widget (iOS 17 App Intents): the connect disc
  # toggles the tunnel directly from the widget process, so this target
  # carries the network-extension entitlement (the "Network Extensions"
  # capability on the com.privycs.vpn.widgets App ID + its provisioning
  # profile). app-groups lets it read the shared WidgetSnapshot +
  # TunnelStatsSnapshot. Embedded into the main app above.
  PrivycsVPNWidget:
    type: app-extension
    platform: iOS
    # Interactive widgets (App Intents / Button(intent:)) are iOS 17-only, so
    # the widget keeps a 17 floor even though the app targets 15. On iOS 15/16
    # the widget is simply not offered; the app itself runs fully.
    deploymentTarget: "17.0"
    sources:
      - path: WidgetExtension
    info:
      path: WidgetExtension/Info.plist
      properties:
        CFBundleDisplayName: Privycs VPN
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: WidgetExtension/PrivycsVPNWidget.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        com.apple.security.application-groups:
          - group.com.privycs.vpn
        # Required so the widget's SwitchProtocolIntent can read the protocol
        # config from the shared Keychain at switch time (v1.1.5 moved it out of
        # the unencrypted snapshot). Mirror the app + tunnel targets — without
        # this the widget's keychain read returns nil and the pills don't switch.
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.privycs.vpn
    dependencies:
      - package: PrivycsCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.privycs.vpn.widgets
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "Privycs VPN Widget App Store"

  # ───── Apple TV (tvOS) App ──────────────────────────────────────
  # Universal Purchase: the tvOS app shares the iOS app's bundle id
  # (com.privycs.vpn) on a different PLATFORM target, so a single App
  # Store purchase / license cross-redeems. Living-room focus UI,
  # gateway-pull only (device-code or manual enrollment), WG/AWG only.
  # Embeds the tvOS packet-tunnel extension below.
  PrivycsVPNtvOS:
    type: application
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - path: tvOS
    resources:
      - path: tvOS/Localizable.xcstrings
    info:
      path: tvOS/Info.plist
      properties:
        CFBundleDisplayName: Privycs VPN
        CFBundleLocalizations:
          - en
          - de
          - es
          - fr
          - it
          - pt
        LSApplicationCategoryType: public.app-category.utilities
        ITSAppUsesNonExemptEncryption: false
        LicensePublicKeyHex: "$(LICENSE_PUBLIC_KEY_HEX)"
        # Local-network import (TVImportServer): the TV hosts a tiny HTTP listener
        # + advertises a Bonjour service so a phone can send a config/backup over
        # the LAN (no gateway). Triggers the tvOS Local Network permission prompt.
        NSLocalNetworkUsageDescription: >
          Privycs uses the local network so you can send a VPN configuration or
          backup from your phone to this Apple TV. Nothing leaves your network.
        NSBonjourServices:
          - _privycs-tv._tcp
        # Privycs design-system fonts (bundled under tvOS/Fonts/, picked up by the
        # tvOS source path). Lets TVFont use Inter + Fira Code.
        UIAppFonts:
          - Inter-Regular.ttf
          - Inter-Medium.ttf
          - Inter-SemiBold.ttf
          - Inter-Bold.ttf
          - FiraCode-Regular.ttf
          - FiraCode-Medium.ttf
          - FiraCode-SemiBold.ttf
        UIRequiredDeviceCapabilities:
          - arm64
    entitlements:
      path: tvOS/PrivycsVPNtvOS.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        com.apple.security.application-groups:
          - group.com.privycs.vpn
        # Required: KeychainSecretStore (settings/token persistence) writes
        # under kSecAttrAccessGroup = group.com.privycs.vpn. Without this
        # entitlement those ops fail at runtime with errSecMissingEntitlement.
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.privycs.vpn
        com.apple.developer.networking.vpn.api:
          - allow-vpn
    dependencies:
      - package: PrivycsCore
      - target: PrivycsVPNtvOSTunnel
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.privycs.vpn
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "Privycs VPN tvOS App Store"
        # tvOS App Icon + Top Shelf come from the Brand Assets set in
        # tvOS/Assets.xcassets; this makes actool emit the required
        # CFBundleIcons.CFBundlePrimaryIcon + TVTopShelfImage Info.plist keys.
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"

  # ───── Apple TV (tvOS) Packet Tunnel Extension ──────────────────
  # Reuses the SAME Tunnel/ sources as the iOS tunnel. OpenVPNAdapter is
  # NOT a dependency here (it doesn't build for tvOS) → `canImport(
  # OpenVPNAdapter)` is false, so the OpenVPN bridge + dispatch compile
  # out. IPSec is impossible on tvOS (no NEVPNManager Personal VPN). Net:
  # WireGuard + AmneziaWG only (both via WireGuardKit, which supports tvOS).
  PrivycsVPNtvOSTunnel:
    type: app-extension
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - path: Tunnel
        # See PrivycsVPNTunnel above — exclude both generated plists so the
        # tvOS tunnel doesn't glob the iOS tunnel's Info.plist as a resource.
        excludes:
          - "Info.plist"
          - "InfoTV.plist"
    info:
      path: Tunnel/InfoTV.plist
      properties:
        CFBundleDisplayName: Privycs VPN Tunnel
        UIRequiredDeviceCapabilities:
          - arm64
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PrivycsPacketTunnelProvider
    entitlements:
      path: tvOS/PrivycsVPNtvOSTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        com.apple.security.application-groups:
          - group.com.privycs.vpn
        # Tunnel reads the same Keychain access group (hydrated configs /
        # secrets) — mirror the iOS tunnel target's keychain-access-groups.
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.privycs.vpn
    dependencies:
      - package: PrivycsCore
      - package: WireGuardKit
        product: WireGuardKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.privycs.vpn.tunnel
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "Privycs VPN Tunnel tvOS App Store"
