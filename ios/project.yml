# XcodeGen project specification — generate PrivycsVPN.xcodeproj
# from this YAML by running `xcodegen generate` from the ios/
# directory on a Mac with XcodeGen installed (`brew install xcodegen`).
#
# Rationale: Xcode's .pbxproj is a 5000+ line binary-flavoured plist
# that's painful to merge + diff. XcodeGen lets us treat the project
# layout as code — single source of truth, regeneratable, line-by-
# line diffable. Used by airbnb / Google for the same reasons.
name: PrivycsVPN
options:
  bundleIdPrefix: com.privycs.vpn
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  defaultConfig: Release
  groupSortPosition: bottom

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: "${PRIVYCS_TEAM_ID}"     # set via .env / CI secret
    CODE_SIGN_STYLE: Manual
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.0.8"                  # synced with ios/latest_version.txt
    CURRENT_PROJECT_VERSION: "49"
    # ed25519 license pubkey hex — overridden by CI from the
    # LICENSE_PUBLIC_KEY_HEX secret; empty default for local builds.
    LICENSE_PUBLIC_KEY_HEX: ""
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: -Onone
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_OPTIMIZATION_LEVEL: -O
      VALIDATE_PRODUCT: YES

packages:
  PrivycsCore:
    path: Core
  WireGuardKit:
    # Upstream zx2c4/wireguard-apple cloned + patched locally by the
    # CI workflow (.github/workflows/ios-release.yml step "Prepare
    # WireGuardKit"). Two reasons for not consuming via URL:
    #   1. Upstream Package.swift declares `// swift-tools-version:5.3`
    #      but uses .macOS(.v12) / .iOS(.v15) — needs PackageDescription
    #      5.5. The pre-clone step patches the first line to 5.5.
    #   2. WireGuardKitGo .linkedLibrary("wg-go") expects libwg-go.a to
    #      exist on the linker search path. SPM cannot build it (Go
    #      toolchain not part of SPM build plugins). CI builds it via
    #      upstream's WireGuardKitGo/Makefile to /tmp/wg-out/.
    # Mullvad's fork was tried and rejected — it pulls maybenot + daita
    # (Mullvad-proprietary obfuscation libs) which need a Rust toolchain
    # and don't apply to our use case.
    path: .deps/wireguard-apple
  # Sentry temporarily removed for Xcode 26 alpha track —
  # see ios/Core/Package.swift comment.
  # Sentry:
  #   url: https://github.com/getsentry/sentry-cocoa
  #   from: 9.15.0
  OpenVPNAdapter:
    url: https://github.com/ss-abramchuk/OpenVPNAdapter
    from: 0.8.0

targets:
  # ───── Main App ─────────────────────────────────────────────────
  PrivycsVPN:
    type: application
    platform: iOS
    sources:
      - path: App
    resources:
      - path: App/Resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Privycs VPN
        # Advertise all 6 localizations so their .lproj are bundled and the
        # in-app LanguageManager (Bundle swizzle) can load any of them.
        CFBundleLocalizations:
          - en
          - de
          - es
          - fr
          - it
          - pt
        LSApplicationCategoryType: public.app-category.utilities
        NSLocationWhenInUseUsageDescription: >
          Privycs uses your location only to read the current Wi-Fi
          name so On-Demand Network Rules can match against trusted
          SSIDs. No location coordinates are stored or transmitted.
        NSCameraUsageDescription: >
          Privycs uses the camera only to scan VPN-config QR codes you
          provide. No images are stored or transmitted.
        ITSAppUsesNonExemptEncryption: false
        LicensePublicKeyHex: "$(LICENSE_PUBLIC_KEY_HEX)"
        UIBackgroundModes:
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.privycs.vpn.poolrotate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen:
          UIImageRespectsSafeAreaInsets: true
    entitlements:
      path: App/PrivycsVPN.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
          - app-proxy-provider
        com.apple.security.application-groups:
          - group.com.privycs.vpn
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.privycs.vpn
        com.apple.developer.networking.vpn.api:
          - allow-vpn
        com.apple.developer.networking.wifi-info: true
    dependencies:
      - package: PrivycsCore
      # - package: Sentry        # temporarily removed, see packages: comment
      #   product: Sentry
      - target: PrivycsVPNTunnel
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.privycs.vpn
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "Privycs VPN App Store"

  # ───── Packet Tunnel Extension ──────────────────────────────────
  PrivycsVPNTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: Tunnel
    info:
      path: Tunnel/Info.plist
      properties:
        CFBundleDisplayName: Privycs VPN Tunnel
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PrivycsPacketTunnelProvider
    entitlements:
      path: Tunnel/PrivycsVPNTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        com.apple.security.application-groups:
          - group.com.privycs.vpn
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.privycs.vpn
    dependencies:
      - package: PrivycsCore
      - package: WireGuardKit
        product: WireGuardKit
      - package: OpenVPNAdapter
        product: OpenVPNAdapter
      # OpenVPNAdapter's openvpn::Reachability code uses
      # SCNetworkReachability* APIs from SystemConfiguration. The
      # upstream Package.swift doesn't declare this link, so we
      # add it here at the Tunnel target level.
      - sdk: SystemConfiguration.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.privycs.vpn.tunnel
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "Privycs VPN Tunnel App Store"
